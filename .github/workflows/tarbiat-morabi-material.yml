name: Tarbiat Morabi material audit
on:
  push:
    branches: [agent/tarbiat-morabi-audit-finalize]
    paths:
      - '.github/tarbiat_morabi_material.py'
      - '.github/workflows/tarbiat-morabi-material.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tarbiat-morabi-audit-finalize
      - name: Build material audit
        run: python .github/tarbiat_morabi_material.py
      - name: Commit material report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tarbiat_morabi_material_candidates.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit material tarbiat morabi differences'
            git push origin HEAD:agent/tarbiat-morabi-audit-finalize
          fi
