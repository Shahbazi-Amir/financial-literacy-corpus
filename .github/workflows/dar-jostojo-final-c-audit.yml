name: Dar Jostojo Final C pair audit

on:
  push:
    paths:
      - '.github/workflows/dar-jostojo-final-c-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pairwise audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, difflib

          out_dir = Path('outputs/dar_jostojo_dar_again_raw_30/review/md')
          ref_dir = Path('متن ها/dar_jostojo_30/md')
          report = Path('reports/dar_jostojo_final_c/pairwise_diff_candidates.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          nums = [*range(1,21), *range(22,31)]

          def normalize(text):
              lines=[]
              for ln in text.splitlines():
                  s=ln.strip()
                  if not s: continue
                  if s.startswith('#'): continue
                  if s.startswith('>'): continue
                  if s.startswith('**') and s.endswith('**'): continue
                  if s.startswith('زبان تشخیص'): continue
                  if s == '---': continue
                  lines.append(s)
              t=' '.join(lines)
              t=t.replace('ي','ی').replace('ك','ک').replace('ۀ','ه').replace('ة','ه')
              t=re.sub(r'[\u200c\u200f\u202a-\u202e]', ' ', t)
              t=re.sub(r'[^\w\u0600-\u06ff۰-۹0-9٪%]+', ' ', t)
              t=re.sub(r'\s+', ' ', t).strip()
              return t.split()

          chunks=[]
          chunks.append('# Dar Jostojo Final C — pairwise audit')
          chunks.append('')
          chunks.append('Base: `outputs/dar_jostojo_dar_again_raw_30/review/md`  ')
          chunks.append('Reference: `متن ها/dar_jostojo_30/md`')
          chunks.append('')
          chunks.append('Only small word-level differences are listed as correction candidates. They are not auto-applied.')
          chunks.append('')

          for n in nums:
              a=normalize((out_dir/f'{n}.md').read_text(encoding='utf-8'))
              b=normalize((ref_dir/f'{n}.md').read_text(encoding='utf-8'))
              sm=difflib.SequenceMatcher(None,a,b,autojunk=False)
              small=[]; large=[]
              for tag,i1,i2,j1,j2 in sm.get_opcodes():
                  if tag=='equal': continue
                  aa=a[i1:i2]; bb=b[j1:j2]
                  if len(aa)<=8 and len(bb)<=8:
                      small.append((tag,' '.join(aa),' '.join(bb)))
                  else:
                      large.append((tag,len(aa),len(bb)))
              chunks.append(f'## {n}.md')
              chunks.append(f'- similarity: `{sm.ratio():.4f}`')
              chunks.append(f'- tokens: base `{len(a)}` / ref `{len(b)}`')
              chunks.append(f'- large diff spans: `{len(large)}`')
              if small:
                  chunks.append('- small candidates:')
                  for tag,aa,bb in small[:250]:
                      chunks.append(f'  - `{tag}` | base: `{aa}` → ref: `{bb}`')
                  if len(small)>250:
                      chunks.append(f'  - ... {len(small)-250} more')
              else:
                  chunks.append('- small candidates: none')
              chunks.append('')
          report.write_text('\n'.join(chunks)+'\n', encoding='utf-8')
          PY
      - name: Commit report and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/dar_jostojo_final_c/pairwise_diff_candidates.md
          git rm .github/workflows/dar-jostojo-final-c-audit.yml
          git commit -m "audit Dar Jostojo 30-session source pairs"
          git push
