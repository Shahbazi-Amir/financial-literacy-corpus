name: Assert final Asre reconciliation
on:
  push:
    branches: [agent/asre-shirin-reconcile-final-md]
permissions:
  contents: write
jobs:
  assert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,shutil
          base=Path('reports/asre_shirin_reconciliation/assertions')
          if base.exists(): shutil.rmtree(base)
          base.mkdir(parents=True)
          d=Path('outputs/asre_shirin/review/md')
          problems=[]
          ratios=[]
          missing=[]
          for n in range(1,27):
              p=d/f'{n}.md'
              if not p.exists():
                  missing.append(n); problems.append(f'missing {n}'); continue
              s=p.read_text(encoding='utf-8')
              if s.lstrip().startswith('# media'):
                  problems.append(f'media heading {n}')
              marks=[]
              if '[نامفهوم]' in s: marks.append('[نامفهوم]')
              if 'گوینده نامشخص' in s: marks.append('گوینده نامشخص')
              if marks:
                  problems.append(f'uncertainty {n}: {marks}')
                  lines=s.splitlines()
                  excerpts=[]
                  for i,line in enumerate(lines):
                      if '[نامفهوم]' in line or 'گوینده نامشخص' in line:
                          excerpts.extend(lines[max(0,i-2):min(len(lines),i+3)])
                          excerpts.append('---')
                  (base/f'needs_review_ep{n:02d}.md').write_text('\n'.join(excerpts)+'\n',encoding='utf-8')
              # retention warning versus original output on main, except missing original ep15
              r=subprocess.run(['git','show',f'origin/main:outputs/asre_shirin/review/md/{n}.md'],capture_output=True,text=True)
              if r.returncode==0:
                  wc=lambda x: len(re.findall(r'[\w\u0600-\u06ff]+',x))
                  old=wc(r.stdout); cur=wc(s)
                  ratio=cur/old if old else 1
                  if ratio < .75:
                      ratios.append((n,ratio,old,cur))
                      (base/f'retention_warning_ep{n:02d}.md').write_text(f'# Retention warning ep {n}\n\noriginal={old}\ncurrent={cur}\nratio={ratio:.3f}\n',encoding='utf-8')
          merge_base=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          archive_ok=subprocess.run(['git','diff','--quiet',merge_base,'HEAD','--','متن ها']).returncode==0
          if not archive_ok: problems.append('archive changed')
          summary='\n'.join([
              '# Asre assertion status','',
              f'missing={missing}',
              f'problems={problems}',
              f'retention_warnings={ratios}',
              f'archive_unchanged={archive_ok}',
          ])+'\n'
          (base/'STATUS.md').write_text(summary,encoding='utf-8')
          if not problems and len(list(d.glob('*.md')))==26:
              (base/'PASS.md').write_text('PASS: 26/26 present; no # media; no [نامفهوم]; no گوینده نامشخص; archive unchanged.\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/assert-final-asre.yml
          git add reports/asre_shirin_reconciliation/assertions
          git commit -m "audit: assert final Asre reconciliation"
          git push origin HEAD:agent/asre-shirin-reconcile-final-md