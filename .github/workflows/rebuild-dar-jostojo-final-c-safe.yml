name: Safely rebuild Dar Jostojo Final C

on:
  push:
    paths:
      - '.github/workflows/rebuild-dar-jostojo-final-c-safe.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset Final C from mother and apply boundary-safe corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          mother=Path('outputs/dar_jostojo_dar_again_raw_30/review/md')
          final=Path('final/dar-jostojo-final-C')
          report_dir=Path('reports/dar_jostojo_final_c')
          final.mkdir(parents=True,exist_ok=True)
          report_dir.mkdir(parents=True,exist_ok=True)
          nums=[*range(1,21),*range(22,31)]

          for p in final.glob('*.md'):
              p.unlink()
          for n in nums:
              shutil.copyfile(mother/f'{n}.md', final/f'{n}.md')

          # kind: 'token' = whole token only; 'phrase' = exact phrase only.
          F={
          1:[('phrase','زندگی موده','زندگیم بوده'),('phrase','منطق یک زندگی مالی رو براتون شهر میدم','منطق یک زندگی مالی رو براتون شرح میدم'),('token','رشتیافه','رشد‌یافته'),('phrase','بیانی ما دانایی','باید ما دانایی'),('token','سهوزه','سه حوزه'),('token','اشق','عشق'),('token','زعیف','ضعیف'),('phrase','لازم نباشیم اون سنگینی رو بار کنیم','لازم نباشه اون سنگینی رو بار کنیم')],
          2:[('token','الهمدلالله','الحمدلله'),('token','الحمدالله','الحمدلله'),('token','بحچه','بچه'),('token','مقایثه','مقایسه'),('phrase','اعتیاده به قرض','اعتیاد به قرض'),('phrase','وزه مالی','وضع مالی'),('phrase','بلنگت تر','بلندقدتر'),('phrase','کتا قد تر','کوتاه‌قدتر'),('token','وایی','وای'),('token','سلاقه','سراغ'),('token','دقیقت','دقت')],
          3:[('token','خواییم','خواهیم'),('token','مسارفت','مسافرت'),('token','گندوم','گندم'),('token','تغیی','تغییر'),('token','کفیت','کیفیت'),('token','پولچاب','پول چاپ'),('phrase','اوضاعع مالی','اوضاع مالی'),('token','دوشواره','دشواره'),('phrase','خساست به خرش','خساست به خرج'),('token','شیشتت','ششصد'),('phrase','داسان سواد','داستان سواد')],
          4:[('token','تعادله','تعادل'),('token','آموزای','آموزه'),('phrase','می گهن','میگه نه'),('phrase','آلم واقع','عالم واقع'),('token','پردم','خوردم'),('phrase','کافر، رسطوران','کافه، رستوران'),('token','پاگوشایی','پاگشاهایی'),('phrase','دستبندی رشته','دسته‌بندی رشد'),('token','دستبندی','دسته‌بندی'),('token','پیچیدهی','پیچیده'),('token','لازمی','لازمه'),('token','زمانتنامه','ضمانت‌نامه'),('phrase','زمانت نامه','ضمانت‌نامه'),('phrase','دست رول عمل','دستورالعمل'),('token','نرم افضارایی','نرم‌افزارهایی'),('token','اسبابازی','اسباب‌بازی'),('token','اززواج','ازدواج')],
          5:[],6:[('token','باغی','باقی')],7:[('token','باغی','باقی')],8:[],9:[],
          10:[('phrase','وضنی 100 کلوی','وزنی صد کیلویی'),('phrase','وضنی صد کلوی','وزنی صد کیلویی'),('token','کلوی','کیلویی'),('token','هرفیی','حرفه‌ای'),('token','تمریم','تمرین'),('token','کمردد','کمردرد'),('token','زانودد','زانودرد'),('token','ورزشگار','ورزشکار'),('token','درصم','درصد'),('token','زار','هزار'),('token','غرز','قرض'),('token','غرزی','قرضی'),('token','رباس','رباست'),('token','خداس','خداست'),('token','اقصات','اقساط'),('phrase','قصد هر ماه','قسط هر ماه'),('phrase','قصد بدم','قسط بدم')],
          11:[('token','باغی','باقی')],
          12:[('token','محسس','مؤسس'),('token','تالا','تا حالا'),('phrase','اقساطمو همی شه','اقساطم رو همیشه'),('phrase','داشت شوشم','داشته باشم'),('token','خودمونو','خودمونو'),('token','خدشدار','خدشه‌دار'),('token','خواییم','خواهیم')],
          13:[],14:[],
          15:[('token','پیادشی','پیاده شی'),('token','زرفیت','ظرفیت'),('token','بعض','بعضی'),('token','آبدارچیه','آبدارچی'),('token','احدای','اهدای'),('phrase','بیل گیتز','بیل گیتس'),('token','نبیانی','نبینی'),('token','محره','مهره'),('token','صده','صد')],
          16:[],17:[],18:[],19:[],
          20:[('phrase','امو ایدایی','عمو، دایی'),('token','ناموهای','نامه‌های'),('token','اسطلاح','اصطلاح'),('token','امونات','امانات'),('token','بخاریم','بخریم'),('token','هزارتومان','هزار تومان'),('token','اخیرم','اخیر هم'),('token','نقدش','نقش')],
          22:[('phrase','سرمای گذارتون چقده','سرمایه‌گذاریتون چقدره'),('token','چقده','چقدر'),('phrase','کنلا نمیخواهن ریسک','کلاً نمی‌خوان ریسک'),('phrase','کنلا نمیخوان ریسک','کلاً نمی‌خوان ریسک'),('token','سرمای','سرمایه')],
          23:[('token','داسان','داستان'),('token','بیخیار','بی‌خیال'),('token','متمرکیز','متمرکز'),('phrase','داراییان می خواد','دارایی هم می‌خواد')],
          24:[('token','حوزهٔه','حوزه‌ی')],25:[('token','باغی','باقی'),('token','هزینهٔه','هزینه‌ی')],26:[('token','اهدام','اهدا')],
          27:[('token','سبت','ثبت'),('token','خداس','خداست'),('token','حوالت','البته'),('token','مجووز','مجوز'),('token','بشت','بهش'),('token','سوادمالی','سواد مالی')],
          28:[],
          29:[('token','ترح','طرح'),('phrase','درانها اقتصاص','در آنها اختصاص'),('token','مواحث','مباحث'),('token','آدتها','عادت‌ها'),('token','مطبعاتی','مطبوعاتی'),('token','پشتیوانی','پشتیبانی'),('token','دستبسی','دسترسی'),('token','گرهد','گرفته')],
          30:[('token','توسع','توسعه')]
          }

          def token_replace(text,old,new):
              pat=re.compile(r'(?<!\w)'+re.escape(old)+r'(?!\w)',re.UNICODE)
              return pat.subn(new,text)

          report=['# Dar Jostojo Final C — applied pair corrections (safe rebuild)','',
                  'Mother: `outputs/dar_jostojo_dar_again_raw_30/review/md`  ',
                  'Secondary correction reference: `متن ها/dar_jostojo_30/md`  ',
                  'Method: reset each Final C file from the mother, then apply only boundary-safe high-confidence corrections. No summarization or compression.','']
          total=0
          for n in nums:
              p=final/f'{n}.md'
              text=p.read_text(encoding='utf-8')
              applied=[]
              if text.startswith('# media'):
                  text=f'# در جستجوی خوشبختی — قسمت {n}'+text[len('# media'):]
                  applied.append(('# media',f'# در جستجوی خوشبختی — قسمت {n}',1))
              for kind,old,new in F.get(n,[]):
                  if old==new: continue
                  if kind=='token':
                      text,c=token_replace(text,old,new)
                  else:
                      c=text.count(old)
                      if c: text=text.replace(old,new)
                  if c: applied.append((old,new,c))
              p.write_text(text,encoding='utf-8')
              total+=sum(x[2] for x in applied)
              report.append(f'## {n}.md')
              if len(applied)==1 and applied[0][0]=='# media':
                  report.append('- No high-confidence substantive correction from the second reference; mother wording retained.')
              else:
                  for old,new,c in applied[1:] if applied and applied[0][0]=='# media' else applied:
                      report.append(f'- `{old}` → `{new}`'+(f' ×{c}' if c>1 else ''))
                  if not applied:
                      report.append('- No high-confidence substantive correction; mother wording retained.')
              report.append('')
          report += ['## 21.md','- Not created: absent from both current 30-session references; reserved for third-source recovery.','',f'Total safe replacements including title labels: **{total}**','']
          (report_dir/'applied_corrections.md').write_text('\n'.join(report),encoding='utf-8')
          PY
      - name: Validate no substring corruption and source isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          final=Path('final/dar-jostojo-final-C')
          expected=set(range(1,21))|set(range(22,31))
          found={int(p.stem) for p in final.glob('*.md') if p.stem.isdigit()}
          assert found==expected
          assert not (final/'21.md').exists()
          bad=['نقششوند','نثبت','تغییرر','توسعهه']
          for p in final.glob('*.md'):
              t=p.read_text(encoding='utf-8')
              for x in bad:
                  assert x not in t,(p,x)
          print('PASS: safe Final C shape and corruption checks')
          PY
          if git status --porcelain | grep -E '^(.. )?(outputs/|متن ها/)'; then
            echo 'ERROR: source reference modified'; git status --porcelain; exit 1
          fi
      - name: Commit safe rebuild and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final/dar-jostojo-final-C reports/dar_jostojo_final_c/applied_corrections.md
          git rm .github/workflows/rebuild-dar-jostojo-final-c-safe.yml
          git commit -m "safely rebuild Dar Jostojo final C from source pair"
          git push
