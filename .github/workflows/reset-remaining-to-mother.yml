name: Reset remaining finals to mother transcripts
on:
  push:
    paths:
      - .github/workflows/reset-remaining-to-mother.yml
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset finals safely
        run: python .github/reset_remaining_to_mother.py
      - name: Verify source isolation
        run: |
          if git status --porcelain -- outputs "متن ها" | grep .; then
            echo "Source files changed"; exit 1
          fi
      - name: Commit safe finals
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git rm -f .github/reset_remaining_to_mother.py .github/workflows/reset-remaining-to-mother.yml
          git commit -m "restore remaining finals to mother transcripts after audit"
          git push
