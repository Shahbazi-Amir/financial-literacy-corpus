name: Audit Dar Jostojo source-3 mapping

on:
  push:
    paths:
      - '.github/workflows/audit-dar-jostojo-source3-mapping.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build mapping report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import math, re

          final_dir=Path('final/dar-jostojo-final-C')
          src_dir=Path('متن ها/dar-jostojo-final')
          out=Path('reports/dar_jostojo_source3_mapping.md')

          def numeric_files(d):
              return sorted([p for p in d.glob('*.md') if p.stem.isdigit()], key=lambda p:int(p.stem))

          finals=numeric_files(final_dir)
          srcs=numeric_files(src_dir)

          trans=str.maketrans({'ي':'ی','ى':'ی','ك':'ک','ة':'ه','ۀ':'ه','ؤ':'و','إ':'ا','أ':'ا','ٱ':'ا'})
          stop={'دکتر','کمیل','رودی','قسمت','در','جستجوی','خوشبختی','سلام','خب','یعنی','مثلا','مثلاً','این','اون','که','و','به','از','رو','را','ما','من','شما','می','هم','یه','یک','برای','با','تو','اگر','اگه','پس','حالا','ولی','یا','است','هست','بود','شد','شده','کنه','کنیم','کرد','کرده','بکنه','بکنیم'}

          def normalize(text):
              text=text.translate(trans)
              text=re.sub(r'\*\*[^\n]+\*\*',' ',text)
              text=re.sub(r'^#+[^\n]*',' ',text,flags=re.M)
              text=re.sub(r'https?://\S+',' ',text)
              text=re.sub(r'[^\w\u0600-\u06ff]+',' ',text)
              toks=[t for t in text.split() if len(t)>1 and t not in stop and not t.isdigit()]
              return toks

          def features(toks):
              f=[]
              f.extend('u:'+t for t in toks)
              f.extend('b:'+toks[i]+'_'+toks[i+1] for i in range(len(toks)-1))
              return Counter(f)

          def grams(toks,n=3):
              return set(tuple(toks[i:i+n]) for i in range(max(0,len(toks)-n+1)))

          def title_excerpt(text):
              lines=[re.sub(r'[#*`>]+','',x).strip() for x in text.splitlines()]
              lines=[x for x in lines if x and 'دکتر کمیل رودی' not in x and not x.startswith('http')]
              return (' '.join(lines[:3]))[:180]

          docs=[]
          meta={}
          for kind,ps in [('F',finals),('S',srcs)]:
              for p in ps:
                  raw=p.read_text(encoding='utf-8')
                  toks=normalize(raw)
                  key=(kind,int(p.stem))
                  docs.append((key,toks))
                  meta[key]={'raw':raw,'toks':toks,'feat':features(toks),'grams':grams(toks),'excerpt':title_excerpt(raw)}

          N=len(docs)
          df=Counter()
          for _,toks in docs:
              df.update(set(features(toks)))
          idf={k:math.log((N+1)/(v+1))+1 for k,v in df.items()}

          def cosine(a,b):
              keys=set(a)&set(b)
              dot=sum(a[k]*b[k]*idf.get(k,1)**2 for k in keys)
              na=math.sqrt(sum(v*v*idf.get(k,1)**2 for k,v in a.items()))
              nb=math.sqrt(sum(v*v*idf.get(k,1)**2 for k,v in b.items()))
              return dot/(na*nb) if na and nb else 0.0

          finals_n=[int(p.stem) for p in finals]
          src_n=[int(p.stem) for p in srcs]
          scores={}
          ranking={}
          for s in src_n:
              arr=[]
              sm=meta[('S',s)]
              for f in finals_n:
                  fm=meta[('F',f)]
                  cos=cosine(sm['feat'],fm['feat'])
                  inter=len(sm['grams'] & fm['grams'])
                  cs=inter/max(1,len(sm['grams']))
                  cf=inter/max(1,len(fm['grams']))
                  score=0.78*cos+0.22*math.sqrt(cs*cf) if cs and cf else 0.78*cos
                  arr.append((score,cos,cs,cf,f))
              arr.sort(reverse=True)
              ranking[s]=arr
              scores[s]=arr[0]

          # Conservative assignment: topic similarity plus margin over runner-up.
          assignment={}
          for s,arr in ranking.items():
              top=arr[0]; second=arr[1]
              score,cos,cs,cf,f=top
              margin=score-second[0]
              assigned = (score>=0.16 and cos>=0.18) or (score>=0.12 and cs>=0.035 and margin>=0.02)
              assignment[s]=f if assigned else None

          grouped=defaultdict(list)
          for s,f in assignment.items():
              if f is not None: grouped[f].append(s)

          missing_41=sorted(set(range(1,42))-set(src_n))
          missing_final=sorted(set(range(1,31))-set(finals_n))

          rows=[]
          rows += ['# Dar Jostojo — Final-C vs 41-part site source','','## Scope',
                   f'- Final-C files: **{len(finals_n)}** → {finals_n}',
                   f'- 41-part source files actually present: **{len(src_n)}** → {src_n}',
                   f'- Missing numbers in the 41-part source: **{missing_41}**',
                   f'- Missing numbers in Final-C: **{missing_final}**',
                   '- Final-C and source files were read-only during this audit. Only this report was generated.','',
                   '## Method','- Persian/Arabic character forms and punctuation were normalized for comparison.',
                   '- Similarity uses TF-IDF over words + adjacent word pairs, plus exact 3-word phrase overlap.',
                   '- `S→F coverage` = fraction of the site-piece 3-word phrases found in that Final-C file.',
                   '- `F→S coverage` = fraction of the Final-C 3-word phrases found in that one site-piece.',
                   '- The mapping is evidence for segmentation/overlap, not a license to modify either source.','']

          rows += ['## 41-part source → best Final-C match','',
                   '| Site file | words | best Final-C | score | S→F | F→S | 2nd best | excerpt |',
                   '|---:|---:|---:|---:|---:|---:|---:|---|']
          for s in src_n:
              arr=ranking[s]
              top=arr[0]; sec=arr[1]
              score,cos,cs,cf,f=top
              chosen=assignment[s]
              label=str(chosen) if chosen is not None else '—'
              ex=meta[('S',s)]['excerpt'].replace('|','/')
              rows.append(f'| {s} | {len(meta[("S",s)]["toks"])} | {label} | {score:.3f} | {cs:.1%} | {cf:.1%} | {sec[4]} ({sec[0]:.3f}) | {ex} |')

          rows += ['','## Final-C → site pieces grouped by content','',
                   '| Final-C | words | mapped site pieces | site words total | site/final size | combined exact 3-gram coverage of Final-C | interpretation |',
                   '|---:|---:|---|---:|---:|---:|---|']
          for f in finals_n:
              ss=sorted(grouped.get(f,[]))
              ft=len(meta[('F',f)]['toks'])
              st=sum(len(meta[('S',s)]['toks']) for s in ss)
              union=set()
              for s in ss: union |= meta[('S',s)]['grams']
              cov=len(union & meta[('F',f)]['grams'])/max(1,len(meta[('F',f)]['grams']))
              ratio=st/ft if ft else 0
              if not ss:
                  interp='No confident site-piece mapped; check missing download / numbering / unique material.'
              elif len(ss)>=2:
                  interp='Likely split into multiple site clips.'
              else:
                  interp='Likely one site clip corresponds mainly to this lesson.'
              if ratio>1.20: interp += ' Site text is materially larger by token count; inspect for extra material.'
              elif ratio<0.75 and ss: interp += ' Final-C is materially larger; site version looks partial/compressed.'
              rows.append(f'| {f} | {ft} | {", ".join(map(str,ss)) if ss else "—"} | {st} | {ratio:.2f}× | {cov:.1%} | {interp} |')

          unassigned=[s for s in src_n if assignment[s] is None]
          rows += ['','## Unassigned / likely non-core or unmatched site files',f'- {unassigned}','']
          for s in unassigned:
              top=ranking[s][0]
              rows.append(f'- **Site {s}** — best weak match Final-C {top[4]} (score {top[0]:.3f}); {meta[("S",s)]["excerpt"]}')

          rows += ['','## Potentially important cases to inspect manually','']
          # Flag site files with low containment despite confident topical match, and groups where site is larger.
          flags=[]
          for s,f in assignment.items():
              if f is None: continue
              score,cos,cs,cf,_=scores[s]
              if cs<0.08 or score<0.24:
                  flags.append(f'- Site **{s}** ↔ Final-C **{f}**: topical match but low exact phrase containment (score {score:.3f}, S→F {cs:.1%}).')
          for f,ss in grouped.items():
              ft=len(meta[('F',f)]['toks']); st=sum(len(meta[('S',s)]['toks']) for s in ss)
              if ss and st>ft*1.15:
                  flags.append(f'- Final-C **{f}** ↔ site **{ss}**: combined site text {st/ft:.2f}× the Final-C token count; possible extra material or duplicated site framing.')
          rows += flags if flags else ['- No major automatic flags.']

          rows += ['','## Top-3 matches for every site file (debug/audit)','']
          for s in src_n:
              tops=ranking[s][:3]
              rows.append(f'- Site **{s}**: '+', '.join(f'F{f} score={sc:.3f} cos={co:.3f} S→F={cs:.1%}' for sc,co,cs,cf,f in tops))

          out.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print(f'WROTE {out}; finals={len(finals_n)} source3={len(src_n)} unassigned={len(unassigned)}')
          PY
      - name: Validate no source/final edits
        shell: bash
        run: |
          if git status --porcelain | grep -E '^(.. )?(final/|outputs/|متن ها/)'; then
            echo 'ERROR: source/final changed'; git status --porcelain; exit 1
          fi
          test -f reports/dar_jostojo_source3_mapping.md
      - name: Commit report and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/dar_jostojo_source3_mapping.md
          git rm .github/workflows/audit-dar-jostojo-source3-mapping.yml
          git commit -m "report Dar Jostojo source-3 mapping"
          git push
