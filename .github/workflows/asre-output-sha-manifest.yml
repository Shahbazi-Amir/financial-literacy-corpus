name: Asre output SHA manifest
on:
  push:
    branches: [agent/asre-shirin-reconcile-final-md]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          d=Path('outputs/asre_shirin/review/md')
          lines=['# Asre Output blob SHA manifest','']
          for n in range(1,27):
              p=d/f'{n}.md'
              if p.exists():
                  b=p.read_bytes()
                  # Git blob SHA-1: sha1("blob <len>\0" + data)
                  h=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  lines.append(f'- {n}: `{h}`')
              else:
                  lines.append(f'- {n}: `MISSING`')
          q=Path('reports/asre_shirin_reconciliation/output_sha_manifest.md'); q.parent.mkdir(parents=True,exist_ok=True); q.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/asre-output-sha-manifest.yml
          git add reports/asre_shirin_reconciliation/output_sha_manifest.md
          git commit -m "audit: record Asre output blob SHAs"
          git push origin HEAD:agent/asre-shirin-reconcile-final-md
