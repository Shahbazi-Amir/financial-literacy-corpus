name: Finalize remaining corpus collections

on:
  push:
    paths:
      - '.github/workflows/finalize-remaining-collections.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build conservative finals and reports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil, difflib, json, unicodedata

          ROOT=Path('.')
          REPORTS=ROOT/'reports'
          REPORTS.mkdir(exist_ok=True)

          # 1) Move the already-curated Dar Jostojo extraction under its Final-C folder.
          src=ROOT/'extracted/dar-jostojo-source3'
          dst=ROOT/'final/dar-jostojo-final-C/extracted/source3'
          if src.exists():
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists(): shutil.rmtree(dst)
              shutil.copytree(src,dst)
              shutil.rmtree(src)
          # keep the earlier reports in reports/ as requested.

          collections=[
            ('khane_to', ROOT/'outputs/khane_to', ROOT/'متن ها/khane-to', ROOT/'final/khane-to', 'خانه تو'),
            ('mq', ROOT/'outputs/mq', ROOT/'متن ها/mq', ROOT/'final/mq', 'MQ'),
            ('tarbiat_morabi', ROOT/'outputs/tarbiat_morabi', ROOT/'متن ها/tarbiat_morabi', ROOT/'final/tarbiat-morabi', 'تربیت مربی'),
            ('uni_tehran', ROOT/'outputs/uni_tehran', ROOT/'متن ها/uni_tehran', ROOT/'final/uni-tehran', 'دانشگاه تهران'),
          ]

          def md_files(root):
              return sorted([p for p in root.rglob('*.md') if p.is_file()]) if root.exists() else []

          def numkey(p):
              nums=re.findall(r'\d+', p.stem)
              return int(nums[-1]) if nums else None

          def norm(s):
              s=unicodedata.normalize('NFKC',s).replace('ي','ی').replace('ك','ک')
              s=re.sub(r'\s+',' ',s).strip()
              return s

          def tokens(s):
              return re.findall(r'[\w\u0600-\u06ff]+|[^\w\s]', norm(s), flags=re.UNICODE)

          def levenshtein(a,b):
              if a==b:return 0
              if not a:return len(b)
              if not b:return len(a)
              prev=list(range(len(b)+1))
              for i,ca in enumerate(a,1):
                  cur=[i]
                  for j,cb in enumerate(b,1):
                      cur.append(min(cur[-1]+1,prev[j]+1,prev[j-1]+(ca!=cb)))
                  prev=cur
              return prev[-1]

          def pair_files(out_files, ref_files):
              om={numkey(p):p for p in out_files if numkey(p) is not None}
              rm={numkey(p):p for p in ref_files if numkey(p) is not None}
              common=sorted(set(om)&set(rm))
              # If numeric pairing is weak but counts match, use order as a fallback and state it.
              if len(common) >= max(1,min(len(out_files),len(ref_files))//2):
                  return [(k,om[k],rm[k],'number') for k in common], sorted(set(om)-set(rm)), sorted(set(rm)-set(om))
              if len(out_files)==len(ref_files) and out_files:
                  return [(i+1,o,r,'order') for i,(o,r) in enumerate(zip(out_files,ref_files))], [], []
              return [], [str(p) for p in out_files], [str(p) for p in ref_files]

          def safe_repair(base, ref):
              # Mother text stays base. Reference is only allowed to repair very local, near-identical tokens.
              bt=tokens(base); rt=tokens(ref)
              sm=difflib.SequenceMatcher(a=bt,b=rt,autojunk=False)
              repl=[]
              for tag,i1,i2,j1,j2 in sm.get_opcodes():
                  if tag!='replace' or i2-i1!=1 or j2-j1!=1: continue
                  a,b=bt[i1],rt[j1]
                  if not (re.fullmatch(r'[\u0600-\u06ff\w]+',a) and re.fullmatch(r'[\u0600-\u06ff\w]+',b)): continue
                  if len(a)<3 or len(b)<3: continue
                  if levenshtein(a,b)>2: continue
                  # Require three-token context on both sides to be identical.
                  left_ok=bt[max(0,i1-3):i1]==rt[max(0,j1-3):j1]
                  right_ok=bt[i2:i2+3]==rt[j2:j2+3]
                  if not (left_ok and right_ok): continue
                  # Avoid style variants; repair only if source is rare and ref form appears elsewhere or source has obvious Arabic variants/noise.
                  suspicious = any(ch in a for ch in 'يكةۀؤإأ') or bt.count(a)<=1
                  plausible = rt.count(b)>=1 and suspicious
                  if plausible:
                      repl.append((a,b))
              # Apply only whole-word replacements and de-duplicate.
              seen=set(); applied=[]; out=base
              for a,b in repl:
                  if (a,b) in seen: continue
                  seen.add((a,b))
                  pat=r'(?<![\w\u0600-\u06ff])'+re.escape(a)+r'(?![\w\u0600-\u06ff])'
                  new,n=re.subn(pat,b,out,count=1)
                  if n:
                      out=new; applied.append((a,b))
              return out,applied

          summary=[]
          for slug,outroot,refroot,finalroot,title in collections:
              of=md_files(outroot); rf=md_files(refroot)
              pairs,missing_ref,missing_out=pair_files(of,rf)
              report=[f'# گزارش نهایی‌سازی — {title}','',
                      '## قاعده',
                      '- Output مرجع مادر است.',
                      '- `متن ها` فقط مرجع تصحیح است.',
                      '- هیچ خلاصه‌سازی، حذف مثال یا تبدیل گفتار به متن رسمی انجام نمی‌شود.',
                      '- فقط اصلاح‌های بسیار محلی و کم‌ریسک که با context یکسان در هر دو منبع قابل اثبات‌اند، خودکار اعمال شده‌اند.',
                      '- مواردی که هم‌ترازی قابل‌دفاع نداشتند دست‌نخورده مانده‌اند.','',
                      '## موجودی',
                      f'- Output MD: {len(of)}',f'- Reference MD: {len(rf)}',f'- Paired: {len(pairs)}','']
              finalroot.mkdir(parents=True,exist_ok=True)
              # clear only md files created by previous run in this final root; preserve nested extras if any
              for p in finalroot.glob('*.md'): p.unlink()
              total_rep=0
              for k,o,r,method in pairs:
                  base=o.read_text(encoding='utf-8',errors='replace')
                  ref=r.read_text(encoding='utf-8',errors='replace')
                  fixed,changes=safe_repair(base,ref)
                  outname=f'{int(k):02d}.md' if isinstance(k,int) else f'{k}.md'
                  (finalroot/outname).write_text(fixed,encoding='utf-8')
                  total_rep+=len(changes)
                  bw=len(re.findall(r'\S+',base)); rw=len(re.findall(r'\S+',ref)); fw=len(re.findall(r'\S+',fixed))
                  ratio=(rw/bw) if bw else 0
                  report.append(f'### {outname}')
                  report.append(f'- مادر: `{o.as_posix()}` ({bw} واژه)')
                  report.append(f'- مرجع دوم: `{r.as_posix()}` ({rw} واژه؛ نسبت {ratio:.2f}×)')
                  report.append(f'- روش جفت‌سازی: {method}')
                  report.append(f'- Final: {fw} واژه')
                  if changes:
                      report.append('- اصلاحات قطعی محلی: '+', '.join([f'`{a}`→`{b}`' for a,b in changes]))
                  else:
                      report.append('- اصلاح خودکار قطعی: ندارد؛ متن مادر حفظ شد.')
                  report.append('')
              if missing_ref:
                  report+=['## Output بدون مرجع دوم', '`'+', '.join(map(str,missing_ref))+'`','']
              if missing_out:
                  report+=['## مرجع دوم بدون Output', '`'+', '.join(map(str,missing_out))+'`','']
              if not pairs:
                  report+=['## وضعیت','⚠️ جفت‌سازی قابل‌دفاع شکل نگرفت؛ برای این مجموعه Final ساخته نشد و باید ساختار منابع دستی بررسی شود.','']
                  # do not leave empty final dir tracked anyway
              report+=['## نتیجه',f'- Final files written: {len(pairs)}',f'- Conservative local repairs: {total_rep}',f'- Final path: `{finalroot.as_posix()}/`']
              (REPORTS/f'{slug}_finalization.md').write_text('\n'.join(report)+'\n',encoding='utf-8')
              summary.append((slug,title,len(of),len(rf),len(pairs),total_rep,bool(pairs),str(finalroot)))

          # concise Asre Shirin report based on current final tree
          asre=list((ROOT/'final/asre_shirin').rglob('episode-*.md')) if (ROOT/'final/asre_shirin').exists() else []
          asre_report='''# گزارش نهایی‌سازی — عصر شیرین

## روش
- Output بازبینی‌شده متن مادر بود.
- نسخه‌های Agent در `متن ها/۱/asre_shirin/` فقط برای رفع ASR، نام‌ها، اعداد و metadata استفاده شدند.
- گفت‌وگو، مثال‌ها، ضرب‌المثل‌ها، اعداد و signature دکتر حفظ شد.
- میان‌برنامه‌های خارج از دانش اصلی حذف شدند.
- فصل اول ۱۳ قسمت و فصل دوم ۱۳ قسمت نهایی شده‌اند؛ قسمت ۱۵ پس از اضافه‌شدن Output تکمیل شد.

## مسیر نهایی
`final/asre_shirin/`

## تعداد
'''+f'- Final episode files: {len(asre)}\n'
          (REPORTS/'asre_shirin_finalization.md').write_text(asre_report,encoding='utf-8')

          # one index report for all collections
          idx=['# Corpus finalization reports','', '- `asre_shirin_finalization.md`', '- `dar_jostojo_final_c/` و گزارش‌های موجود در همین پوشه', '- `khane_to_finalization.md`', '- `mq_finalization.md`', '- `tarbiat_morabi_finalization.md`', '- `uni_tehran_finalization.md`','', '## Run summary','']
          for slug,title,a,b,c,d,ok,path in summary:
              idx.append(f'- **{title}**: output={a}, reference={b}, paired/final={c}, conservative repairs={d}, status={"PASS" if ok else "REVIEW"}, path=`{path}`')
          (REPORTS/'FINALIZATION_INDEX.md').write_text('\n'.join(idx)+'\n',encoding='utf-8')
          PY
      - name: Validate source isolation
        shell: bash
        run: |
          # Sources must remain untouched. Only extraction relocation, final/, reports/, and workflow removal are allowed.
          bad=$(git status --porcelain | grep -E '^( M|M |A |D |R |\?\?) (outputs/|"?متن ها/)' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo 'ERROR: source modified'; exit 1; fi
          test -d final/dar-jostojo-final-C/extracted/source3
          test -f reports/khane_to_finalization.md
          test -f reports/mq_finalization.md
          test -f reports/tarbiat_morabi_finalization.md
          test -f reports/uni_tehran_finalization.md
      - name: Commit all finalized corpus work
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A final reports extracted
          git rm .github/workflows/finalize-remaining-collections.yml
          git commit -m "finalize remaining transcript collections and consolidate reports"
          git push
