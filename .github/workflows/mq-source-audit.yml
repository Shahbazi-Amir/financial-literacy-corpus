name: MQ source audit

on:
  push:
    branches:
      - agent/mq-audit-finalize

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mq-audit-finalize
      - name: Audit MQ sources
        run: python .github/mq_source_audit.py
      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mq_source_audit.md
          if git diff --cached --quiet; then
            echo 'No report change'
          else
            git commit -m 'audit MQ sources'
            git push
          fi
