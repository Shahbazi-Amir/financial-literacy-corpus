name: Khane To speaker formatting
on:
  push:
    branches: [agent/khane-to-speaker-format]
    paths:
      - '.github/workflows/khane-to-speaker-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/khane-to-speaker-format
          fetch-depth: 0
      - name: Normalize repeated speaker labels
        run: python .github/khane_to_normalize_speakers.py
      - name: Validate scope and content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          changed = subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          allowed = [p for p in changed if p.startswith('outputs/khane_to/review/md/') or p == 'reports/khane_to_speaker_formatting.md']
          assert sorted(changed) == sorted(allowed), changed
          # No consecutive identical known speaker labels may survive.
          speaker = re.compile(r'^\*\*(فرهاد جم|دکتر کمیل رودی|فرهاد جم / دکتر کمیل رودی|شرکت‌کننده \d+)\*\*$')
          for ep in range(1,14):
              text = Path(f'outputs/khane_to/review/md/{ep}.md').read_text(encoding='utf-8')
              labels = [m.group(1) for line in text.splitlines() if (m := speaker.match(line.strip()))]
              assert all(a != b for a,b in zip(labels, labels[1:])), (ep, labels)
          ep1 = Path('outputs/khane_to/review/md/1.md').read_text(encoding='utf-8')
          assert '[نامفهوم]' not in ep1
          assert 'به خاطر این‌که وقتمون رو' in ep1
          assert 'چه استعاره‌ی خوبی' in ep1
          print('PASS')
          PY
      - name: Commit formatted transcripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/khane_to/review/md reports/khane_to_speaker_formatting.md
          git diff --cached --quiet || git commit -m 'normalize Khane To speaker turns and resolve episode 1 audio gaps'
          git push origin HEAD:agent/khane-to-speaker-format
