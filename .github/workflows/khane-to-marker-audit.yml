name: Khane To marker audit
on:
  push:
    branches: [agent/khane-to-finalize-work]
    paths:
      - '.github/khane_to_marker_audit.py'
      - '.github/workflows/khane-to-marker-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/khane-to-finalize-work
      - name: Run marker audit
        run: python .github/khane_to_marker_audit.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/khane_to_reference_marker_audit.md
          git commit -m 'audit Khane To reference-only markers' || true
          git push origin HEAD:agent/khane-to-finalize-work
