name: Dar Jostojo Final C lexical audit

on:
  push:
    paths:
      - '.github/workflows/dar-jostojo-final-c-lexical-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wordfreq
        run: pip install --quiet wordfreq
      - name: Build lexical audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, difflib
          from wordfreq import zipf_frequency

          out_dir=Path('outputs/dar_jostojo_dar_again_raw_30/review/md')
          ref_dir=Path('متن ها/dar_jostojo_30/md')
          dst=Path('reports/dar_jostojo_final_c/lexical_candidates.md')
          dst.parent.mkdir(parents=True,exist_ok=True)
          nums=[*range(1,21),*range(22,31)]

          def clean_lines(text):
              lines=[]
              for ln in text.splitlines():
                  s=ln.strip()
                  if not s or s.startswith('#') or s.startswith('>') or (s.startswith('**') and s.endswith('**')) or s=='---' or s.startswith('زبان تشخیص'):
                      continue
                  lines.append(s)
              t=' '.join(lines).replace('ي','ی').replace('ك','ک').replace('ۀ','ه').replace('ة','ه')
              t=re.sub(r'[\u200c\u200f\u202a-\u202e]',' ',t)
              t=re.sub(r'[^\w\u0600-\u06ff۰-۹0-9٪%]+',' ',t)
              return re.sub(r'\s+',' ',t).strip().split()

          def score(tokens):
              vals=[]
              for w in tokens:
                  if re.fullmatch(r'[۰-۹0-9٪%]+',w):
                      vals.append(4.0); continue
                  vals.append(zipf_frequency(w,'fa'))
              return sum(vals)/len(vals) if vals else 0

          out=['# Dar Jostojo Final C — lexical correction candidates','',
               'Only cases where the second reference has materially higher Persian word-frequency are shown. Manual review is still required.','']
          for n in nums:
              a=clean_lines((out_dir/f'{n}.md').read_text(encoding='utf-8'))
              b=clean_lines((ref_dir/f'{n}.md').read_text(encoding='utf-8'))
              sm=difflib.SequenceMatcher(None,a,b,autojunk=False)
              rows=[]
              for tag,i1,i2,j1,j2 in sm.get_opcodes():
                  if tag!='replace': continue
                  aa=a[i1:i2]; bb=b[j1:j2]
                  if not aa or not bb or len(aa)>6 or len(bb)>6: continue
                  sa,sb=score(aa),score(bb)
                  if (sb-sa>=1.0 and sb>=2.5) or (sa==0 and sb>=2.0):
                      rows.append((sa,sb,' '.join(aa),' '.join(bb)))
              out.append(f'## {n}.md')
              if not rows:
                  out.append('- none')
              else:
                  for sa,sb,aa,bb in rows:
                      out.append(f'- base `{aa}` ({sa:.2f}) → ref `{bb}` ({sb:.2f})')
              out.append('')
          dst.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit report and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/dar_jostojo_final_c/lexical_candidates.md
          git rm .github/workflows/dar-jostojo-final-c-lexical-audit.yml
          git commit -m "add lexical audit for Dar Jostojo final C"
          git push
