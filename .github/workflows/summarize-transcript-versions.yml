name: Summarize transcript versions

on:
  push:
    branches:
      - agent/consolidate-transcript-sources
    paths:
      - .github/workflows/summarize-transcript-versions.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-transcript-sources
          fetch-depth: 0

      - name: Build source/version summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('.')

          def collection_for(path: str):
              s = path.lower().replace('-', '_')
              if 'asre_shirin' in s:
                  return 'asre_shirin'
              if 'khane_to' in s:
                  return 'khane_to'
              if 'uni_tehran' in s or 'tehran' in s:
                  return 'uni_tehran'
              if re.search(r'(^|[/_])mq([/_]|$)', s):
                  return 'mq'
              if 'dar_jostojo' in s or 'dar_jostojoye' in s:
                  return 'dar_jostojoye_khoshbakhti'
              if 'tarbiat' in s or 'morabi' in s:
                  return 'tarbiat_morabi'
              return 'unclassified'

          def role_for(path: str):
              s = path.lower().replace('\\', '/')
              if '/sources/pipeline_review/md' in s:
                  return 'pipeline_review'
              if '/sources/pipeline_review/timestamped' in s:
                  return 'pipeline_review_timestamped'
              if 'asre-shirin-season-' in s:
                  return 'old_agent'
              if '/reviewed/' in s:
                  return 'legacy_reviewed'
              if '/final/' in s or 'dar-jostojo-final' in s:
                  return 'legacy_final'
              if '/machine/' in s:
                  return 'machine'
              if '/raw/' in s:
                  return 'raw'
              if s.endswith('/md'):
                  return 'md_set'
              if s.endswith('/timestamped'):
                  return 'timestamped_set'
              if s.endswith('/txt'):
                  return 'txt_set'
              return 'other'

          groups = []
          exact_hashes = {}
          for d in sorted(p for p in root.rglob('*') if p.is_dir()):
              rel = str(d.relative_to(root))
              if rel.startswith('.git') or rel.startswith('.github') or rel.startswith('reports'):
                  continue
              files = [p for p in d.iterdir() if p.is_file() and p.suffix.lower() in {'.md', '.txt'}]
              if not files:
                  continue
              md = [p for p in files if p.suffix.lower() == '.md']
              txt = [p for p in files if p.suffix.lower() == '.txt']
              groups.append({
                  'collection': collection_for(rel),
                  'role': role_for(rel),
                  'path': rel,
                  'md_count': len(md),
                  'txt_count': len(txt),
              })
              for p in files:
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  exact_hashes.setdefault(digest, []).append(str(p.relative_to(root)))

          dup_groups = [v for v in exact_hashes.values() if len(v) > 1]
          dup_files = sum(len(v) - 1 for v in dup_groups)

          # Source families count: collapse format mirrors of same generation.
          families = {}
          for g in groups:
              c = g['collection']
              p = g['path']
              r = g['role']
              key = None
              if r.startswith('pipeline_review'):
                  key = 'pipeline_review'
              elif c == 'asre_shirin' and r == 'old_agent':
                  key = 'old_agent_archive'
              elif '/session-' in p and r in {'legacy_final','legacy_reviewed','machine','raw'}:
                  session = re.search(r'session-(\d+)', p)
                  key = f"legacy_sessions_{r}"
              elif 'dar-jostojo-final' in p:
                  key = 'legacy_final_collection'
              elif r in {'md_set','timestamped_set','txt_set'}:
                  # md/timestamped/txt under the same parent are one generation.
                  parent = str(Path(p).parent)
                  key = f"set:{parent}"
              else:
                  key = f"path:{p}"
              fam = families.setdefault((c,key), {'collection':c,'family':key,'paths':[],'primary_md_count':0})
              fam['paths'].append(p)
              if r not in {'pipeline_review_timestamped','timestamped_set','txt_set'}:
                  fam['primary_md_count'] += g['md_count']

          by_collection = {}
          for fam in families.values():
              by_collection.setdefault(fam['collection'], []).append(fam)

          lines = ['# Transcript source inventory — pre-dedup', '']
          lines.append(f'- Exact duplicate groups: **{len(dup_groups)}**')
          lines.append(f'- Redundant exact-copy files beyond one retained copy: **{dup_files}**')
          lines.append('')
          for collection in sorted(by_collection):
              if collection == 'unclassified':
                  continue
              lines.append(f'## {collection}')
              fams = sorted(by_collection[collection], key=lambda x: x['family'])
              lines.append(f'- Source families detected: **{len(fams)}**')
              for fam in fams:
                  paths = '; '.join(fam['paths'])
                  lines.append(f"- `{fam['family']}` — primary MD files: {fam['primary_md_count']} — {paths}")
              lines.append('')

          lines.append('## Exact duplicate examples')
          for paths in dup_groups[:50]:
              lines.append('- ' + ' ↔ '.join(f'`{p}`' for p in paths))

          Path('reports/transcript_version_summary_pre_dedup.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('reports/transcript_version_summary_pre_dedup.json').write_text(
              json.dumps({
                  'groups': groups,
                  'source_families': list(families.values()),
                  'exact_duplicate_groups': dup_groups,
                  'redundant_exact_copy_file_count': dup_files,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('\n'.join(lines[:80]))
          PY

      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/summarize-transcript-versions.yml
          git add -A
          git commit -m 'report: summarize transcript versions before dedup'
          git push origin HEAD:agent/consolidate-transcript-sources
