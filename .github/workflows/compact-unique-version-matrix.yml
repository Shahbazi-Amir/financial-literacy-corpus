name: Compact unique version matrix

on:
  push:
    branches:
      - agent/consolidate-transcript-sources
    paths:
      - .github/workflows/compact-unique-version-matrix.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-transcript-sources
          fetch-depth: 0
      - name: Build compact exact-unique chapter matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('.')

          def collection_for(path):
              s=path.lower().replace('-','_')
              if 'asre_shirin' in s: return 'asre_shirin'
              if 'khane_to' in s: return 'khane_to'
              if 'uni_tehran' in s or 'tehran' in s: return 'uni_tehran'
              if re.search(r'(^|[/_])mq([/_]|$)',s): return 'mq'
              if 'tarbiat' in s or 'morabi' in s: return 'tarbiat_morabi'
              if 'dar_jostojo' in s or 'dar_jostojoye' in s: return 'dar_jostojoye_khoshbakhti'
              return None

          def chapter_for(path):
              s=path.replace('\\','/')
              m=re.search(r'asre-shirin-season-(\d+)/episode-(\d+)\.md$',s,re.I)
              if m:
                  season,ep=int(m.group(1)),int(m.group(2))
                  return str(ep if season==1 else 13+ep)
              m=re.search(r'/session-(\d+)/',s,re.I)
              if m: return str(int(m.group(1)))
              stem=Path(s).stem
              if stem.isdigit(): return str(int(stem))
              m=re.search(r'episode-(\d+)',stem,re.I)
              return str(int(m.group(1))) if m else None

          def role(path):
              s=path.replace('\\','/').lower()
              if '/timestamped/' in s: return 'timestamped'
              if s.endswith('.txt'): return 'txt'
              if '/raw/' in s: return 'raw'
              if '/machine/' in s: return 'machine'
              if '/sources/pipeline_review/md/' in s: return 'pipeline_review'
              if '/review/md/' in s: return 'review_md'
              if '/reviewed/' in s: return 'reviewed'
              if '/final/' in s or '/dar-jostojo-final/' in s: return 'final'
              if 'asre-shirin-season-' in s: return 'old_agent'
              if s.endswith('.md'): return 'plain_md'
              return 'other'

          comparison_roles={'pipeline_review','review_md','reviewed','final','old_agent','plain_md'}
          rows={}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.md','.txt'}: continue
              rel=str(p.relative_to(root))
              if rel.startswith(('.git/','.github/','reports/')) or p.name=='README.md': continue
              c=collection_for(rel); ch=chapter_for(rel)
              if not c or not ch: continue
              r=role(rel)
              e=rows.setdefault(c,{}).setdefault(ch,{'comparison_unique':0,'all_unique_files':0,'roles':{}})
              e['all_unique_files']+=1
              e['roles'][r]=e['roles'].get(r,0)+1
              if r in comparison_roles: e['comparison_unique']+=1

          lines=['# Exact-unique transcript versions by chapter','',
                 '> No normalization. Counts are after exact byte-copy removal only.','',
                 '> `comparison_unique` counts remaining MD transcript versions suitable for later comparison; timestamped/TXT/raw/machine representations are reported separately and are not counted as separate comparison versions.','']
          for c in sorted(rows):
              lines.append(f'## {c}')
              lines.append('| Chapter | Comparison-unique versions | All unique files | Breakdown |')
              lines.append('|---:|---:|---:|---|')
              for ch in sorted(rows[c],key=lambda x:int(x)):
                  e=rows[c][ch]
                  br=', '.join(f'{k}:{v}' for k,v in sorted(e['roles'].items()))
                  lines.append(f"| {ch} | {e['comparison_unique']} | {e['all_unique_files']} | {br} |")
              lines.append('')
          Path('reports/exact_unique_versions_by_chapter.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('reports/exact_unique_versions_by_chapter.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('\n'.join(lines[:160]))
          PY
      - name: Commit compact matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/compact-unique-version-matrix.yml
          git add -A
          git commit -m 'report: add exact-unique chapter version matrix'
          git push origin HEAD:agent/consolidate-transcript-sources
