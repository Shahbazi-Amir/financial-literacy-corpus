name: Finalize shared ASR cleanup Dar Jostojo Final C

on:
  push:
    paths:
      - '.github/workflows/finalize-dar-jostojo-shared-asr-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute reviewed correction map and normalize certain bad stems
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf=Path('.github/workflows/apply-dar-jostojo-shared-asr-cleanup.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY\n      - name: Validate",start)
          exec(compile(textwrap.dedent(wf[start:end]),'shared_asr_map.py','exec'),{})

          root=Path('final/dar-jostojo-final-C')
          # These stems are not valid intended words anywhere in this collection;
          # replacing the stem also safely covers attached Persian suffixes.
          stem_fixes={
            'پجوهش':'پژوهش','پجوش':'پژوهش','معلف':'مؤلفه',
            'نوستانگیری':'نوسان‌گیری','رمزرز':'رمزارز','رمزرس':'رمزارز',
            'خانابدگی':'خانوادگی','تشقیص':'تشخیص','حدررفت':'هدررفت',
            'جامبستارد':'جامپ‌استارت'
          }
          for p in root.glob('*.md'):
              t=p.read_text(encoding='utf-8')
              for a,b in stem_fixes.items():
                  t=t.replace(a,b)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Validate final shape and source isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('final/dar-jostojo-final-C')
          expected=set(range(1,21))|set(range(22,31))
          found={int(p.stem) for p in root.glob('*.md') if p.stem.isdigit()}
          assert found==expected
          assert not (root/'21.md').exists()
          alltext='\n'.join((root/f'{n}.md').read_text(encoding='utf-8') for n in sorted(expected))
          forbidden=['نوستانگیری','رمزرز','رمزرس','خانابدگی','دوچار','انترنت','تشقیص','حدررفت','ثبتگردان','ترراحی','پجوهش','پجوش','معلف های','معلفها','جامبستارد']
          for x in forbidden:
              assert x not in alltext, x
          assert 'نقدشوندگی' in alltext
          print('PASS: Final C source-pair cleanup complete')
          PY
          if git status --porcelain | grep -E '^(.. )?(outputs/|متن ها/)'; then
            echo 'ERROR: source references modified'; git status --porcelain; exit 1
          fi
      - name: Commit and remove all temporary cleanup workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final/dar-jostojo-final-C reports/dar_jostojo_final_c/shared_asr_applied.md
          git rm .github/workflows/apply-dar-jostojo-shared-asr-cleanup.yml
          git rm .github/workflows/retry-dar-jostojo-shared-asr-cleanup.yml
          git rm .github/workflows/finalize-dar-jostojo-shared-asr-cleanup.yml
          git commit -m "clean shared ASR errors in Dar Jostojo final C"
          git push
