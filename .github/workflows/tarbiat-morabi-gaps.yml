name: Tarbiat Morabi gap audit
on:
  push:
    branches: [agent/tarbiat-morabi-audit-finalize]
    paths:
      - '.github/tarbiat_morabi_gaps.py'
      - '.github/workflows/tarbiat-morabi-gaps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tarbiat-morabi-audit-finalize
      - name: Build gap report
        run: python .github/tarbiat_morabi_gaps.py
      - name: Commit gap report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tarbiat_morabi_gap_candidates.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit tarbiat morabi gaps'
            git push origin HEAD:agent/tarbiat-morabi-audit-finalize
          fi
