name: Tarbiat Morabi source audit
on:
  push:
    branches: [agent/tarbiat-morabi-audit-finalize]
    paths:
      - '.github/tarbiat_morabi_audit.py'
      - '.github/workflows/tarbiat-morabi-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tarbiat-morabi-audit-finalize
      - name: Build audit
        run: python .github/tarbiat_morabi_audit.py
      - name: Commit audit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tarbiat_morabi_source_audit.md reports/tarbiat_morabi_merge_candidates.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit tarbiat morabi sources'
            git push origin HEAD:agent/tarbiat-morabi-audit-finalize
          fi
