name: Finalize remaining collections v2
on:
  push:
    paths:
      - .github/workflows/finalize-remaining-v2.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build finals
        run: python .github/finalize_remaining.py
      - name: Verify sources unchanged
        run: |
          if git status --porcelain -- outputs "متن ها" | grep .; then
            echo "Source files changed"; exit 1
          fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A final reports extracted
          git rm -f .github/finalize_remaining.py .github/workflows/finalize-remaining-v2.yml .github/workflows/finalize-remaining-collections.yml
          git commit -m "finalize remaining transcript collections and reports"
          git push
