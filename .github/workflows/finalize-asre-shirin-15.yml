name: Finalize Asre Shirin episode 15

on:
  push:
    paths:
      - '.github/workflows/finalize-asre-shirin-15.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Final 15 conservatively from Output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('outputs/asre_shirin/review/md/15.md')
          dst=Path('final/asre_shirin/season-2/episode-15.md')
          text=src.read_text(encoding='utf-8')
          if text.startswith('# media'):
              body=text[len('# media'):].lstrip('\n')
          else:
              body=text
          header='''# سواد مالی برای خانم‌ها؛ شناخت خود با کار داوطلبانه

عصر شیرین — فصل دوم، قسمت دوم (قسمت ۱۵ مجموعه)  
**گویندگان:** دکتر کمیل رودی، خانم متولیان و شرکت‌کنندگان کارگاه  
**مدت:** ۲۷:۳۳  
**منبع رسمی:** https://www.fintelligence.ir/Blog/Detail/F9E733EA/%D8%B3%D9%88%D8%A7%D8%AF-%D9%85%D8%A7%D9%84%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AE%D8%A7%D9%86%D9%85%D9%87%D8%A7-%DA%A9%D8%A7%D8%B1-%D8%AF%D8%A7%D9%88%D8%B7%D9%84%D8%A8%D8%A7%D9%86%D9%87  
**ویدئو:** https://www.aparat.com/v/fuq8mtk

'''
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(header+body,encoding='utf-8')
          # Fidelity check: apart from replacing the generic heading with metadata,
          # the full reviewed Output body must remain byte-for-byte identical.
          made=dst.read_text(encoding='utf-8')
          assert made.endswith(body)
          assert len(body)>1000
          PY
      - name: Validate source isolation
        shell: bash
        run: |
          git status --porcelain
          if git status --porcelain | grep -E '^(.. )?(outputs/|متن ها/)'; then
            echo 'ERROR: reference source modified'; exit 1
          fi
          test -f final/asre_shirin/season-2/episode-15.md
      - name: Commit Final 15 and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final/asre_shirin/season-2/episode-15.md
          git rm .github/workflows/finalize-asre-shirin-15.yml
          git commit -m "finalize Asre Shirin episode 15"
          git push
