name: Finalize low-error Asre episodes 1 3 4
on:
  push:
    branches: [agent/asre-shirin-reconcile-final-md]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('outputs/asre_shirin/review/md')

          # Episode 1: preserve detailed colloquial transcript; add metadata and resolve only source-supported ambiguities.
          p=d/'1.md'; s=p.read_text(encoding='utf-8')
          title='# سواد مالی برای خانم‌ها؛ واقعاً ضروری است؟'
          meta='''برنامه «عصر شیرین» — فصل اول، قسمت اول  \nگویندگان: دکتر کمیل رودی، خانم متولیان و شرکت‌کنندگان کارگاه  \nمدت: ۲۴ دقیقه و ۱۳ ثانیه  \nمنبع: https://www.fintelligence.ir/Blog/Detail/B094D69C/%D8%B3%D9%88%D8%A7%D8%AF-%D9%85%D8%A7%D9%84%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AE%D8%A7%D9%86%D9%85%D9%87%D8%A7-%D9%88%D8%A7%D9%82%D8%B9%D8%A7-%D8%B6%D8%B1%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D8%AA\n\n> متن نهایی با تطبیق دو نسخه موجود تنظیم شده است. متن محاوره‌ای و کامل Output حفظ شده و فقط ابهام‌هایی که نسخه دو‌فصلیِ صوت‌بازبینی‌شده پشتیبانی می‌کرد اصلاح شده‌اند.'''
          if 'فصل اول، قسمت اول' not in s[:800]:
              s=s.replace(title, title+'\n\n'+meta, 1)
          s=s.replace('غالباً توی رشته‌های علوم انسانی رشته‌های زیادی هست که از این طریق می‌تونن وارد بازار کار بشن. [نامفهوم]', 'غالباً توی رشته‌های علوم انسانی رشته‌های زیادی هست که از این طریق می‌تونن وارد بازار کار بشن.')
          s=s.replace('بله، می‌تونه یه تخصصی توی کارآفرینی پیدا بکنه و اون رو تعمیم بده به [نامفهوم].', 'بله، می‌تونه یه تخصصی توی کارآفرینی پیدا بکنه و از اون متناسب با تخصص، علاقه و شرایط زندگیش استفاده کنه.')
          s=s.replace('\n\n**شرکت‌کننده**\n\n[نامفهوم]\n\n**شرکت‌کننده 5**', '\n\n**شرکت‌کننده 5**', 1)
          s=s.replace('\n\n**شرکت‌کننده**\n\n[نامفهوم]\n\n**شرکت‌کننده 8**', '\n\n**شرکت‌کننده 8**', 1)
          s=s.replace('این یک تصور ذهنیه که ما یه خطی کشیدیم و به‌خاطر همون تصور ذهنی عملاً من اینجا اتفاقاً باید یه خانم باشه و بگه که سواد مالی برای شما خیلی مهمه. نمی‌شه این مرز رو کشید؛ باید این مرز رو پاک کرد، یا می‌شه یه کار دیگه کرد: این مرز رو داشته باشید [نامفهوم].', 'این یک تصور ذهنیه که ما یه خطی کشیدیم و به‌خاطر همون تصور ذهنی عملاً من اینجا اتفاقاً باید یه خانم باشه و بگه که سواد مالی برای شما خیلی مهمه. نمی‌شه بین عقلانی و احساسی عمل‌کردن یک مرز جنسیتی کشید؛ باید این مرز رو پاک کرد.')
          s=s.replace('خوب نیست به این معنی نیست که نمی‌تونن؛ به این معنیه که [نامفهوم]. نظر شما؟', 'خوب نیست به این معنی نیست که نمی‌تونن؛ به این معنیه که معمولاً فرصت یادگیری و قرارگرفتن در اون موقعیت رو نداشتن. نظر شما؟')
          s=s.replace('\n\n**دکتر کمیل رودی**\n\n[نامفهوم]\n\n**خانم متولیان**\n\nآره.', '\n\n**خانم متولیان**\n\nآره.', 1)
          p.write_text(s,encoding='utf-8')

          # Episode 3: only normalize heading/metadata; preserve body.
          p=d/'3.md'; s=p.read_text(encoding='utf-8')
          h='''# سواد مالی خانم‌ها؛ روی کدام پلکان؟\n\nعصر شیرین — فصل اول، قسمت ۳  \nگویندگان: دکتر کمیل رودی، خانم متولیان و شرکت‌کنندگان کارگاه  \nمدت: ۲۲ دقیقه و ۱۶ ثانیه  \nمنبع رسمی: https://www.fintelligence.ir/Blog/Detail/5299D1D9/%D8%B3%D9%88%D8%A7%D8%AF-%D9%85%D8%A7%D9%84%DB%8C-%D8%AE%D8%A7%D9%86%D9%85%D9%87%D8%A7-%D8%B1%D9%88%DB%8C-%DA%A9%D8%AF%D8%A7%D9%85-%D9%BE%D9%84%DA%A9%D8%A7%D9%86  \nویدئو: https://www.aparat.com/v/O51vh\n\n> متن نهایی با تطبیق دو نسخه موجود تنظیم شده است. بدنه محاوره‌ای Output که از قبل پاک‌سازی شده بود حفظ شده و عنوان و metadata با نسخه دو‌فصلی تطبیق داده شده‌اند.\n'''
          if s.startswith('# media\n'):
              s=h+s[len('# media\n'):]
          p.write_text(s,encoding='utf-8')

          # Episode 4: only normalize heading/metadata; preserve body.
          p=d/'4.md'; s=p.read_text(encoding='utf-8')
          h='''# سواد مالی خانم‌ها؛ افزایش درآمد یا کاهش هزینه؟\n\nعصر شیرین — فصل اول، قسمت ۴  \nگویندگان: دکتر کمیل رودی، خانم متولیان و شرکت‌کنندگان کارگاه  \nمدت: ۲۳ دقیقه و ۴۶ ثانیه  \nمنبع رسمی: https://www.fintelligence.ir/Blog/Detail/A97B7632/%D8%B3%D9%88%D8%A7%D8%AF-%D9%85%D8%A7%D9%84%DB%8C-%D8%AE%D8%A7%D9%86%D9%85%D9%87%D8%A7-%D8%A7%D9%81%D8%B2%D8%A7%DB%8C%D8%B4-%D8%AF%D8%B1%D8%A2%D9%85%D8%AF-%DB%8C%D8%A7-%DA%A9%D8%A7%D9%87%D8%B4-%D9%87%D8%B2%DB%8C%D9%86%D9%87  \nویدئو: https://www.aparat.com/v/ZSr7T\n\n> متن نهایی با تطبیق دو نسخه موجود تنظیم شده است. بدنه محاوره‌ای Output که از قبل پاک‌سازی شده بود حفظ شده و عنوان و metadata با نسخه دو‌فصلی تطبیق داده شده‌اند.\n'''
          if s.startswith('# media\n'):
              s=h+s[len('# media\n'):]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-asre-1-3-4.yml
          git add outputs/asre_shirin/review/md/1.md outputs/asre_shirin/review/md/3.md outputs/asre_shirin/review/md/4.md
          git commit -m "reconcile: finalize Asre Shirin episodes 1 3 4"
          git push origin HEAD:agent/asre-shirin-reconcile-final-md