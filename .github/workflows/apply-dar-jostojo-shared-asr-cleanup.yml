          def token_sub(text, old, new):
              pat=re.compile(r'(?<!\w)'+re.escape(old)+r'(?!\w)', re.UNICODE)
              return pat.subn(new,text)

          rows=['# Dar Jostojo Final C — shared ASR corrections','',
                'These corrections address high-confidence errors that were present in both the mother transcript and the secondary 30-session reference.','',
                'Ambiguous quotations, names, technical contract labels, and unclear phrases were intentionally left untouched for third-source/audio review.','']
          total=0
          for n in nums:
              p=root/f'{n}.md'
              text=p.read_text(encoding='utf-8')
              applied=[]
              # Global token-safe pass.
              for old,new in global_tokens.items():
                  text,c=token_sub(text,old,new)
                  if c: applied.append((old,new,c,'token'))
              cfg=per.get(n,{'tokens':{},'phrases':{}})
              for old,new in cfg.get('tokens',{}).items():
                  text,c=token_sub(text,old,new)
                  if c: applied.append((old,new,c,'token'))
              for old,new in cfg.get('phrases',{}).items():
                  c=text.count(old)
                  if c:
                      text=text.replace(old,new)
                      applied.append((old,new,c,'phrase'))
              p.write_text(text,encoding='utf-8')
              rows.append(f'## {n}.md')
              if applied:
                  for old,new,c,kind in applied:
                      rows.append(f'- `{old}` → `{new}`'+(f' ×{c}' if c>1 else ''))
              else:
                  rows.append('- No additional high-confidence shared-ASR correction applied.')
              rows.append('')
              total += sum(c for _,_,c,_ in applied)
          rows += ['## 21.md','- Still absent by design: missing from both current 30-session sources; reserved for third-source recovery.','',f'Total shared-ASR replacements: **{total}**','']
          report.write_text('\n'.join(rows),encoding='utf-8')
