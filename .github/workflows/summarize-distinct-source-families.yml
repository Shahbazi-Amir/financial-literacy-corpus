name: Summarize distinct transcript source families

on:
  push:
    branches:
      - agent/consolidate-transcript-sources
    paths:
      - .github/workflows/summarize-distinct-source-families.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-transcript-sources
          fetch-depth: 0

      - name: Count distinct source families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('.')

          def norm(s):
              return s.lower().replace('\\','/').replace('-','_')

          def collection_for(path):
              s = norm(path)
              if 'asre_shirin' in s: return 'asre_shirin'
              if 'khane_to' in s: return 'khane_to'
              if 'uni_tehran' in s or 'tehran' in s: return 'uni_tehran'
              if re.search(r'(^|[/_])mq([/_]|$)', s): return 'mq'
              if 'dar_jostojo' in s or 'dar_jostojoye' in s: return 'dar_jostojoye_khoshbakhti'
              if 'tarbiat' in s or 'morabi' in s: return 'tarbiat_morabi'
              return 'unclassified'

          def bucket_for(path):
              p = Path(path)
              parts = p.parts
              if len(parts) >= 2 and parts[0] == 'متن ها':
                  return f'legacy_bucket_{parts[1]}'
              if parts and parts[0] == 'collections':
                  return 'corpus_import'
              return parts[0] if parts else 'root'

          def role_for(path):
              s = norm(path)
              if '/sources/pipeline_review/md' in s: return 'pipeline_review'
              if '/sources/pipeline_review/timestamped' in s: return 'pipeline_review_timestamped'
              if 'asre_shirin_season_' in s: return 'old_agent_archive'
              if s.endswith('/reviewed'): return 'session_reviewed'
              if s.endswith('/final'): return 'session_final'
              if s.endswith('/machine'): return 'session_machine'
              if s.endswith('/raw'): return 'session_raw'
              if 'dar_jostojo_final' in s: return 'legacy_final_collection'
              if s.endswith('/review/md'): return 'review_md_set'
              if s.endswith('/review/timestamped'): return 'review_timestamped_set'
              if s.endswith('/review/txt'): return 'review_txt_set'
              if s.endswith('/md'): return 'md_set'
              if s.endswith('/timestamped'): return 'timestamped_set'
              if s.endswith('/txt'): return 'txt_set'
              return 'other'

          raw_groups = []
          for d in sorted(p for p in root.rglob('*') if p.is_dir()):
              rel = str(d.relative_to(root))
              if rel.startswith(('.git','.github','reports')):
                  continue
              md_files = sorted([p for p in d.iterdir() if p.is_file() and p.suffix.lower()=='.md'])
              if not md_files:
                  continue
              raw_groups.append({
                  'path': rel,
                  'collection': collection_for(rel),
                  'bucket': bucket_for(rel),
                  'role': role_for(rel),
                  'files': md_files,
              })

          families = {}
          for g in raw_groups:
              c,b,r,p = g['collection'],g['bucket'],g['role'],g['path']
              if c == 'unclassified':
                  continue
              if r == 'pipeline_review_timestamped' or r in {'timestamped_set','review_timestamped_set'}:
                  continue
              if r in {'txt_set','review_txt_set'}:
                  continue

              if r == 'old_agent_archive':
                  key = (c,b,'old_agent_archive')
              elif r.startswith('session_'):
                  key = (c,b,r)
              elif r == 'legacy_final_collection':
                  key = (c,b,'legacy_final_collection')
              elif r == 'review_md_set':
                  key = (c,b,'review_md_set:' + str(Path(p).parent.parent))
              elif r == 'md_set':
                  key = (c,b,'md_set:' + str(Path(p).parent))
              elif r == 'pipeline_review':
                  key = (c,b,'pipeline_review')
              else:
                  key = (c,b,'path:' + p)

              fam = families.setdefault(key, {
                  'collection': c,
                  'bucket': b,
                  'family': key[2],
                  'paths': [],
                  'files': [],
              })
              fam['paths'].append(p)
              fam['files'].extend(g['files'])

          def episode_key(p):
              # Preserve enough identity to compare aggregated families.
              name = p.name
              m = re.search(r'(\d+)', name)
              if m:
                  return int(m.group(1))
              m = re.search(r'session[_-](\d+)', norm(str(p)))
              return int(m.group(1)) if m else name

          for fam in families.values():
              entries=[]
              for p in fam['files']:
                  entries.append((str(episode_key(p)), hashlib.sha256(p.read_bytes()).hexdigest()))
              entries.sort()
              fam['primary_md_count'] = len(fam['files'])
              fam['signature'] = hashlib.sha256(json.dumps(entries).encode()).hexdigest()
              fam.pop('files',None)

          by_collection = {}
          for fam in families.values():
              by_collection.setdefault(fam['collection'], []).append(fam)

          output = {}
          lines = ['# Distinct transcript source families — pre-dedup', '']
          for c in sorted(by_collection):
              fams = sorted(by_collection[c], key=lambda x:(x['bucket'],x['family']))
              sig_groups={}
              for f in fams:
                  sig_groups.setdefault(f['signature'],[]).append(f)
              distinct = len(sig_groups)
              output[c] = {
                  'detected_families_before_exact_collapse': len(fams),
                  'distinct_families_after_exact_collapse': distinct,
                  'families': fams,
                  'exact_equivalent_family_groups': [
                      [{'bucket':x['bucket'],'family':x['family'],'paths':x['paths']} for x in xs]
                      for xs in sig_groups.values() if len(xs)>1
                  ],
              }
              lines.append(f'## {c}')
              lines.append(f'- Families before exact collapse: **{len(fams)}**')
              lines.append(f'- Distinct families after exact collapse: **{distinct}**')
              for f in fams:
                  lines.append(f"- `{f['bucket']} / {f['family']}` — {f['primary_md_count']} MD — {'; '.join(f['paths'])}")
              eq = output[c]['exact_equivalent_family_groups']
              if eq:
                  lines.append(f'- Exact-equivalent family groups: **{len(eq)}**')
              lines.append('')

          Path('reports/distinct_transcript_source_families_pre_dedup.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('reports/distinct_transcript_source_families_pre_dedup.json').write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit corrected summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/summarize-distinct-source-families.yml
          git add -A
          git commit -m 'report: count distinct transcript source families'
          git push origin HEAD:agent/consolidate-transcript-sources
