name: Audit common ASR errors Dar Jostojo Final C

on:
  push:
    paths:
      - '.github/workflows/dar-jostojo-common-asr-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet wordfreq
      - name: Find suspicious low-frequency tokens with context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from wordfreq import zipf_frequency
          import re, collections
          root=Path('final/dar-jostojo-final-C')
          out=['# Dar Jostojo Final C — shared ASR suspicion audit','',
               'Tokens below Persian Zipf 2.7, excluding numerals and very short tokens. Context is included for manual review.','']
          for p in sorted(root.glob('*.md'), key=lambda x:int(x.stem)):
              text=p.read_text(encoding='utf-8')
              toks=list(re.finditer(r'[\u0600-\u06FF‌]+',text))
              rows=[]; seen=set()
              for m in toks:
                  w=m.group(0).strip('‌')
                  if len(w)<4: continue
                  if w in seen: continue
                  z=zipf_frequency(w.replace('‌',' '),'fa')
                  if z>=2.7: continue
                  seen.add(w)
                  a=max(0,m.start()-45); b=min(len(text),m.end()+45)
                  ctx=re.sub(r'\s+',' ',text[a:b]).strip()
                  rows.append((z,w,ctx))
              out.append(f'## {p.stem}.md')
              if not rows: out.append('- none')
              else:
                  for z,w,ctx in sorted(rows)[:180]:
                      out.append(f'- `{w}` [{z:.2f}] — {ctx}')
              out.append('')
          Path('reports/dar_jostojo_final_c/shared_asr_suspicions.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit report and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/dar_jostojo_final_c/shared_asr_suspicions.md
          git rm .github/workflows/dar-jostojo-common-asr-audit.yml
          git commit -m "audit shared ASR errors in Dar Jostojo final C"
          git push
