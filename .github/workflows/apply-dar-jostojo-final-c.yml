name: Apply Dar Jostojo Final C corrections

on:
  push:
    paths:
      - '.github/workflows/apply-dar-jostojo-final-c.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conservative source-pair corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('final/dar-jostojo-final-C')
          report_dir = Path('reports/dar_jostojo_final_c')
          report_dir.mkdir(parents=True, exist_ok=True)
          nums = [*range(1,21), *range(22,31)]

          # Only high-confidence corrections supported by the second 30-session reference
          # or unambiguous Persian orthography/ASR cleanup. No summarization or rewriting.
          fixes = {
            1: [
              ('زندگی موده','زندگیم بوده'),
              ('منطق یک زندگی مالی رو براتون شهر میدم','منطق یک زندگی مالی رو براتون شرح میدم'),
              ('رشتیافه','رشد‌یافته'),
              ('بیانی ما دانایی','باید ما دانایی'),
              ('سهوزه','سه حوزه'),
              ('اشق','عشق'),
              ('زعیف','ضعیف'),
              ('لازم نباشیم اون سنگینی رو بار کنیم','لازم نباشه اون سنگینی رو بار کنیم'),
            ],
            2: [
              ('الهمدلالله','الحمدلله'),
              ('الحمدالله','الحمدلله'),
              ('بحچه','بچه'),
              ('مقایثه','مقایسه'),
              ('اعتیاده به قرض','اعتیاد به قرض'),
              ('وزه مالی','وضع مالی'),
              ('بلنگت تر','بلندقدتر'),
              ('کتا قد تر','کوتاه‌قدتر'),
              ('وایی سدن','وایسادن'),
              ('سلاقه','سراغ'),
              ('دقیقت','دقت'),
            ],
            3: [
              ('خواییم','خواهیم'),
              ('مسارفت','مسافرت'),
              ('گندوم','گندم'),
              ('تغیی','تغییر'),
              ('کفیت','کیفیت'),
              ('پولچاب','پول چاپ'),
              ('اوضاعع مالی','اوضاع مالی'),
              ('دوشواره','دشواره'),
              ('خساست به خرش','خساست به خرج'),
              ('شیشتت','ششصد'),
              ('داسان سواد','داستان سواد'),
            ],
            4: [
              ('تعادله','تعادل'),
              ('آموزای','آموزه'),
              ('می گهن','میگه نه'),
              ('آلم واقع','عالم واقع'),
              ('پردم','خوردم'),
              ('کافر، رسطوران','کافه، رستوران'),
              ('پاگوشایی','پاگشاهایی'),
              ('دستبندی رشته','دسته‌بندی رشد'),
              ('دستبندی','دسته‌بندی'),
              ('پیچیدهی','پیچیده'),
              ('لازمی','لازمه'),
              ('زمانتنامه','ضمانت‌نامه'),
              ('زمانت نامه','ضمانت‌نامه'),
              ('دست رول عمل','دستورالعمل'),
              ('نرم افضارایی','نرم‌افزارهایی'),
              ('اسبابازی','اسباب‌بازی'),
              ('اززواج','ازدواج'),
            ],
            5: [],
            6: [('باغی','باقی')],
            7: [('باغی','باقی')],
            8: [],
            9: [],
            10: [
              ('وضنی 100 کلوی','وزنی صد کیلویی'),
              ('وضنی صد کلوی','وزنی صد کیلویی'),
              ('کلوی','کیلویی'),
              ('هرفیی','حرفه‌ای'),
              ('تمریم','تمرین'),
              ('کمردد','کمردرد'),
              ('زانودد','زانودرد'),
              ('ورزشگار','ورزشکار'),
              ('درصم','درصد'),
              (' زار',' هزار'),
              ('غرز','قرض'),
              ('غرزی','قرضی'),
              ('رباس','رباست'),
              ('خداس','خداست'),
              ('اقصات','اقساط'),
              ('قصد هر ماه','قسط هر ماه'),
              ('قصد بدم','قسط بدم'),
            ],
            11: [('باغی','باقی')],
            12: [
              ('محسس','مؤسس'),
              ('تالا','تا حالا'),
              ('اقساطمو همی شه','اقساطم رو همیشه'),
              ('داشت شوشم','داشته باشم'),
              ('خودمونو خدشدار','خودمونو خدشه‌دار'),
              ('خواییم','خواهیم'),
            ],
            13: [],
            14: [],
            15: [
              ('پیادشی','پیاده شی'),
              ('زرفیت','ظرفیت'),
              ('بعض ','بعضی '),
              ('آبدارچیه','آبدارچی'),
              ('احدای','اهدای'),
              ('بیل گیتز','بیل گیتس'),
              ('نبیانی','نبینی'),
              ('محره','مهره'),
              (' صده ',' صد '),
            ],
            16: [],
            17: [],
            18: [],
            19: [],
            20: [
              ('امو ایدایی','عمو، دایی'),
              ('ناموهای','نامه‌های'),
              ('اسطلاح','اصطلاح'),
              ('امونات','امانات'),
              ('بخاریم','بخریم'),
              ('هزارتومان','هزار تومان'),
              ('اخیرم','اخیر هم'),
              ('نقدش','نقش'),
            ],
            22: [
              ('سرمای گذارتون چقده','سرمایه‌گذاریتون چقدره'),
              ('چقده','چقدر'),
              ('کنلا نمیخواهن ریسک','کلاً نمی‌خوان ریسک'),
              ('کنلا نمیخوان ریسک','کلاً نمی‌خوان ریسک'),
              ('سرمای ','سرمایه '),
            ],
            23: [
              ('داسان','داستان'),
              ('بیخیار','بی‌خیال'),
              ('متمرکیز','متمرکز'),
              ('داراییان می خواد','دارایی هم می‌خواد'),
            ],
            24: [('حوزهٔه','حوزه‌ی')],
            25: [
              ('باغی','باقی'),
              ('هزینهٔه','هزینه‌ی'),
            ],
            26: [('اهدام','اهدا')],
            27: [
              ('سبت','ثبت'),
              ('خداس','خداست'),
              ('حوالت','البته'),
              ('مجووز','مجوز'),
              ('بشت','بهش'),
              ('سوادمالی','سواد مالی'),
            ],
            28: [],
            29: [
              ('ترح ','طرح '),
              ('درانها اقتصاص','در آنها اختصاص'),
              ('مواحث','مباحث'),
              ('آدتها','عادت‌ها'),
              ('مطبعاتی','مطبوعاتی'),
              ('پشتیوانی','پشتیبانی'),
              ('دستبسی','دسترسی'),
              ('گرهد','گرفته'),
            ],
            30: [
              ('توسع','توسعه'),
            ],
          }

          report = ['# Dar Jostojo Final C — applied pair corrections','',
                    'Mother: `outputs/dar_jostojo_dar_again_raw_30/review/md`  ',
                    'Secondary correction reference: `متن ها/dar_jostojo_30/md`  ',
                    'Rule: preserve mother transcript; apply only high-confidence corrections. No summarization.','']

          total_changes = 0
          for n in nums:
              p = root / f'{n}.md'
              text = p.read_text(encoding='utf-8')
              # Final-only presentation label; no content rewriting.
              old_title = '# media'
              new_title = f'# در جستجوی خوشبختی — قسمت {n}'
              applied=[]
              if text.startswith(old_title):
                  text = new_title + text[len(old_title):]
                  applied.append((old_title,new_title,1))
              for old,new in fixes.get(n,[]):
                  count=text.count(old)
                  if count:
                      text=text.replace(old,new)
                      applied.append((old,new,count))
              p.write_text(text,encoding='utf-8')
              total_changes += sum(c for _,_,c in applied)
              report.append(f'## {n}.md')
              if applied:
                  for old,new,c in applied:
                      report.append(f'- `{old}` → `{new}`' + (f' ×{c}' if c>1 else ''))
              else:
                  report.append('- No high-confidence substantive correction from the second reference; mother text retained.')
              report.append('')

          report.append('## 21.md')
          report.append('- Not created: session 21 is absent from both the mother and secondary 30-session references. It is reserved for third-source review.')
          report.append('')
          report.append(f'Total applied literal replacements/title labels: **{total_changes}**')
          (report_dir/'applied_corrections.md').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY
      - name: Validate sources untouched and final shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          expected=set(range(1,21))|set(range(22,31))
          root=Path('final/dar-jostojo-final-C')
          found={int(p.stem) for p in root.glob('*.md') if p.stem.isdigit()}
          assert found==expected,(sorted(found),sorted(expected))
          assert not (root/'21.md').exists()
          for n in expected:
              t=(root/f'{n}.md').read_text(encoding='utf-8')
              assert t.startswith(f'# در جستجوی خوشبختی — قسمت {n}')
          print('PASS: 29 Final C files; 21 intentionally absent')
          PY
      - name: Commit corrections and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final/dar-jostojo-final-C reports/dar_jostojo_final_c/applied_corrections.md
          git rm .github/workflows/apply-dar-jostojo-final-c.yml
          git commit -m "reconcile Dar Jostojo final C against second 30-session source"
          git push
