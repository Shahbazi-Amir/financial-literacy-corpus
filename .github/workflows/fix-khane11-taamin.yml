name: Fix Khane To 11 taamin
on:
  push:
    paths:
      - '.github/workflows/fix-khane11-taamin.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('final/khane-to/episode-11.md')
          s=p.read_text(encoding='utf-8')
          old='دوازده مانین منو تصمیم میکن'
          new='دوازده مانین منو تأمین میکن'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          r=Path('reports/collections/khane_to.md')
          t=r.read_text(encoding='utf-8')
          t=t.replace('| 11 | `تأمیم` | `تصمیم` | 1 |','| 11 | `تأمیم` | `تأمین` | 1 |')
          r.write_text(t,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final/khane-to/episode-11.md reports/collections/khane_to.md
          git rm .github/workflows/fix-khane11-taamin.yml
          git commit -m 'fix Khane To episode 11 taamin context'
          git push
