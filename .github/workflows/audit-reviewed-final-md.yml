name: Audit reviewed final markdown versions

on:
  push:
    branches:
      - agent/consolidate-transcript-sources
    paths:
      - .github/workflows/audit-reviewed-final-md.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-transcript-sources
          fetch-depth: 0
      - name: Audit reviewed/final MD candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          from collections import defaultdict, Counter

          root=Path('.')

          def collection_for(path):
              s=str(path).lower()
              if 'asre_shirin' in s or 'asre-shirin' in s:
                  return 'asre_shirin'
              if 'dar_jostojo' in s or 'dar-jostojo' in s or 'jostojoye' in s:
                  return 'dar_jostojoye_khoshbakhti'
              if 'khane_to' in s or 'khane-to' in s:
                  return 'khane_to'
              if re.search(r'(^|/)mq(/|$)', s):
                  return 'mq'
              if 'tarbiat_morabi' in s or 'tarbiat-morabi' in s or 'tarbiat morabi' in s:
                  return 'tarbiat_morabi'
              if 'uni_tehran' in s or 'uni-tehran' in s or 'tehran' in s:
                  return 'uni_tehran'
              return None

          def is_candidate(path):
              s=str(path).lower()
              if path.suffix.lower() != '.md':
                  return False
              if any(x in s for x in ['/timestamped/', '/raw/', '/machine/', '/base/']):
                  return False
              return any(x in s for x in ['/review/', '/reviewed/', '/final/', 'reviewed', '-final/', '_final/'])

          def episode_for(path):
              # Prefer terminal numeric filename.
              if path.stem.isdigit():
                  return int(path.stem)
              s=str(path).lower()
              m=re.search(r'session[-_ ]?(\d+)', s)
              if m:
                  return int(m.group(1))
              m=re.search(r'episode[-_ ]?(\d+)', s)
              if m:
                  return int(m.group(1))
              return None

          def source_class(path):
              s=str(path).lower()
              if 'pipeline_review' in s:
                  return 'pipeline_review'
              if '/reviewed/' in s or 'transcript.reviewed' in s:
                  return 'reviewed'
              if '/final/' in s or '-final/' in s or '_final/' in s:
                  return 'final'
              if '/review/md/' in s:
                  return 'review_md'
              if '/review/' in s:
                  return 'review_other'
              return 'other'

          rows=[]
          for p in root.rglob('*.md'):
              if not p.is_file() or not is_candidate(p):
                  continue
              col=collection_for(p)
              if not col:
                  continue
              data=p.read_bytes()
              rows.append({
                  'collection':col,
                  'episode':episode_for(p),
                  'path':p.as_posix(),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'size':len(data),
                  'source_class':source_class(p),
              })

          grouped=defaultdict(list)
          for r in rows:
              grouped[r['collection']].append(r)

          result={}
          for col, items in sorted(grouped.items()):
              # unique reviewed/final MD versions by episode + exact bytes
              by_ep=defaultdict(list)
              for r in items:
                  by_ep[r['episode']].append(r)
              ep_summary={}
              for ep, rs in sorted(by_ep.items(), key=lambda kv: (kv[0] is None, kv[0] or 10**9)):
                  uniq={r['sha256'] for r in rs}
                  ep_summary[str(ep) if ep is not None else 'unknown']={
                      'unique_versions':len(uniq),
                      'files':len(rs),
                      'classes':dict(Counter(r['source_class'] for r in rs)),
                      'paths':[r['path'] for r in rs],
                  }
              distribution=Counter(v['unique_versions'] for k,v in ep_summary.items() if k!='unknown')
              result[col]={
                  'candidate_md_files':len(items),
                  'unique_exact_files':len({r['sha256'] for r in items}),
                  'episode_count':len([k for k in ep_summary if k!='unknown']),
                  'source_classes':dict(Counter(r['source_class'] for r in items)),
                  'version_distribution':dict(sorted(distribution.items())),
                  'episodes':ep_summary,
              }

          Path('reports/reviewed_final_md_versions.json').write_text(json.dumps({'collections':result,'files':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['# Reviewed/final MD version audit','',
                 'Scope: `.md` files only; paths indicating `review`, `reviewed`, or `final`; excludes timestamped/raw/machine/base. Exact-identical files collapse only for version counting.','']
          for col,x in result.items():
              lines += [f'## {col}',
                        f"- candidate MD files: **{x['candidate_md_files']}**",
                        f"- exact-unique MD file contents: **{x['unique_exact_files']}**",
                        f"- episodes represented: **{x['episode_count']}**",
                        f"- source classes: `{x['source_classes']}`",
                        f"- episodes by unique reviewed/final MD version count: `{x['version_distribution']}`",'']
              # compact episode ranges by version count
              buckets=defaultdict(list)
              for ep,v in x['episodes'].items():
                  if ep!='unknown': buckets[v['unique_versions']].append(int(ep))
              for n, eps in sorted(buckets.items()):
                  lines.append(f"  - {n} version(s): {eps}")
              lines.append('')
          Path('reports/reviewed_final_md_versions.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit audit report and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/audit-reviewed-final-md.yml
          git add -A
          git commit -m 'report: count reviewed final markdown versions'
          git push origin HEAD:agent/consolidate-transcript-sources
