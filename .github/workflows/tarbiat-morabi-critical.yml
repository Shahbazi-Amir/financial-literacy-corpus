name: Tarbiat Morabi critical audit
on:
  push:
    branches: [agent/tarbiat-morabi-audit-finalize]
    paths:
      - '.github/tarbiat_morabi_critical.py'
      - '.github/workflows/tarbiat-morabi-critical.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tarbiat-morabi-audit-finalize
      - name: Build critical candidates
        run: python .github/tarbiat_morabi_critical.py
      - name: Commit critical report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tarbiat_morabi_critical_candidates.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit critical tarbiat morabi differences'
            git push origin HEAD:agent/tarbiat-morabi-audit-finalize
          fi
