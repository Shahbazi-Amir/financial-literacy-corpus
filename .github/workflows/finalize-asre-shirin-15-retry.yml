name: Finalize Asre Shirin 15 retry
on:
  push:
    paths:
      - '.github/workflows/finalize-asre-shirin-15-retry.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create final file
        shell: bash
        run: |
          mkdir -p final/asre_shirin/season-2
          cat > /tmp/header15.txt <<'EOF'
          # سواد مالی برای خانم‌ها؛ شناخت خود با کار داوطلبانه

          عصر شیرین — فصل دوم، قسمت دوم (قسمت ۱۵ مجموعه)  
          **گویندگان:** دکتر کمیل رودی، خانم متولیان و شرکت‌کنندگان کارگاه  
          **مدت:** ۲۷:۳۳  
          **منبع رسمی:** https://www.fintelligence.ir/Blog/Detail/F9E733EA/%D8%B3%D9%88%D8%A7%D8%AF-%D9%85%D8%A7%D9%84%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AE%D8%A7%D9%86%D9%85%D9%87%D8%A7-%DA%A9%D8%A7%D8%B1-%D8%AF%D8%A7%D9%88%D8%B7%D9%84%D8%A8%D8%A7%D9%86%D9%87  
          **ویدئو:** https://www.aparat.com/v/fuq8mtk

          EOF
          sed 's/^          //' /tmp/header15.txt > final/asre_shirin/season-2/episode-15.md
          tail -n +2 outputs/asre_shirin/review/md/15.md >> final/asre_shirin/season-2/episode-15.md
          test -s final/asre_shirin/season-2/episode-15.md
      - name: Validate references untouched
        shell: bash
        run: |
          if git status --porcelain | grep -E '^(.. )?(outputs/|متن ها/)'; then
            echo 'ERROR reference changed'
            exit 1
          fi
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final/asre_shirin/season-2/episode-15.md
          git rm .github/workflows/finalize-asre-shirin-15-retry.yml .github/workflows/finalize-asre-shirin-15.yml
          git commit -m 'finalize Asre Shirin episode 15'
          git push
