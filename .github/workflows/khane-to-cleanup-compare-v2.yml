name: Khane To cleanup and compare v2
on:
  push:
    branches: [agent/khane-to-final-reconcile]
    paths:
      - '.github/workflows/khane-to-cleanup-compare-v2.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/khane-to-final-reconcile
      - name: Cleanup markers and compare
        run: python .github/khane_to_cleanup_and_compare.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          hits=[]
          for p in Path('outputs/khane_to/review/md').glob('*.md'):
              if '[نامفهوم]' in p.read_text(encoding='utf-8'): hits.append(str(p))
          assert not hits, hits
          assert Path('reports/khane_to_output_vs_texts_audit.md').exists()
          print('PASS')
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/khane_to/review/md reports/khane_to_output_vs_texts_audit.md
          git commit -m 'remove khane-to unclear markers and audit references' || true
          git push origin HEAD:agent/khane-to-final-reconcile
