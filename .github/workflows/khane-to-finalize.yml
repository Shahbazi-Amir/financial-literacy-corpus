name: Khane To finalization
on:
  push:
    branches: [agent/khane-to-finalize-work]
    paths:
      - '.github/khane_to_finalize.py'
      - '.github/workflows/khane-to-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/khane-to-finalize-work
      - name: Build final files
        run: python .github/khane_to_finalize.py
      - name: Validate source scope
        run: |
          test "$(find final/khane-to -maxdepth 1 -name 'episode-*.md' | wc -l)" -eq 13
          ! grep -R -n '\[نامفهوم\]' final/khane-to
      - name: Commit generated finals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final/khane-to reports/khane_to_finalization.md
          git commit -m 'build conservative Khane To final corpus' || true
          git push origin HEAD:agent/khane-to-finalize-work
