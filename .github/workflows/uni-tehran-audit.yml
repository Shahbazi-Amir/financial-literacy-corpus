name: Uni Tehran source audit
on:
  push:
    branches: [agent/uni-tehran-audit-finalize]
    paths:
      - '.github/uni_tehran_audit.py'
      - '.github/workflows/uni-tehran-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/uni-tehran-audit-finalize
      - name: Audit sources
        run: python .github/uni_tehran_audit.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/uni_tehran_source_audit.md
          git commit -m 'audit Uni Tehran sources' || true
          git push origin HEAD:agent/uni-tehran-audit-finalize
