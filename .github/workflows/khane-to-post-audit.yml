name: Khane To post ASR audit
on:
  push:
    branches: [agent/khane-to-asr-cleanup]
    paths:
      - .github/workflows/khane-to-post-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/khane-to-asr-cleanup
          fetch-depth: 0
      - run: pip install wordfreq
      - run: python .github/khane_to_post_audit.py
      - name: Commit post audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/khane_to_asr_post reports/khane_to_asr_post_summary.md
          git commit -m "audit cleaned khane-to ASR"
          git push origin HEAD:agent/khane-to-asr-cleanup
