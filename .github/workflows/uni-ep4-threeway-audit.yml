name: Uni Tehran ep4 three-way audit
on:
  push:
    branches: [agent/uni-tehran-ep4-three-way-final]
    paths:
      - '.github/uni_ep4_threeway_audit.py'
      - '.github/workflows/uni-ep4-threeway-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build audit
        run: python .github/uni_ep4_threeway_audit.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/uni_tehran_ep4_threeway_audit.md
          git diff --cached --quiet || git commit -m 'audit uni tehran episode 4 three-way'
          git push
