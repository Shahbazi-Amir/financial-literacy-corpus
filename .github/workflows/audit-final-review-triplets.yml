name: Audit final review triplets

on:
  push:
    branches:
      - agent/consolidate-transcript-sources
    paths:
      - .github/workflows/audit-final-review-triplets.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-transcript-sources
          fetch-depth: 0
      - name: Clone vid_pipeline read-only
        run: git clone --depth 200 https://github.com/Shahbazi-Amir/vid_pipeline.git /tmp/vid_pipeline
      - name: Audit review triplets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          root=Path('/tmp/vid_pipeline')
          out=[]
          for review in sorted((root/'outputs').glob('*/review')):
              col=review.parent.name
              sets={}
              for kind,ext in [('md','.md'),('timestamped','.md'),('txt','.txt')]:
                  d=review/kind
                  nums=set()
                  if d.is_dir():
                      for p in d.glob(f'*{ext}'):
                          if p.stem.isdigit() and p.stat().st_size>0:
                              nums.add(int(p.stem))
                  sets[kind]=nums
              complete=sets['md'] & sets['timestamped'] & sets['txt']
              union=sets['md'] | sets['timestamped'] | sets['txt']
              subjects=subprocess.check_output(
                  ['git','-C',str(root),'log','--format=%s','--',str(review.relative_to(root))],
                  text=True, errors='replace'
              ).splitlines()
              out.append({
                  'collection':col,
                  'md':sorted(sets['md']),
                  'timestamped':sorted(sets['timestamped']),
                  'txt':sorted(sets['txt']),
                  'complete_triplets':sorted(complete),
                  'incomplete_episodes':sorted(union-complete),
                  'missing_md':sorted(union-sets['md']),
                  'missing_timestamped':sorted(union-sets['timestamped']),
                  'missing_txt':sorted(union-sets['txt']),
                  'chatgpt_history': [s for s in subjects if 'chatgpt' in s.lower()][:30],
                  'recent_review_history': subjects[:30],
              })
          report={'vid_pipeline_head':subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),'collections':out}
          Path('reports/final_review_triplets_audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['# Final review triplets audit','',f"vid_pipeline HEAD: `{report['vid_pipeline_head']}`",'']
          for x in out:
              lines += [f"## {x['collection']}",f"- complete triplets: **{len(x['complete_triplets'])}** — {x['complete_triplets']}",f"- md: {len(x['md'])}; timestamped: {len(x['timestamped'])}; txt: {len(x['txt'])}",f"- incomplete: {x['incomplete_episodes']}",f"- missing md: {x['missing_md']}",f"- missing timestamped: {x['missing_timestamped']}",f"- missing txt: {x['missing_txt']}",f"- ChatGPT history found: **{'yes' if x['chatgpt_history'] else 'no'}**",'']
          Path('reports/final_review_triplets_audit.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/audit-final-review-triplets.yml
          git add -A
          git commit -m 'report: audit final review triplets'
          git push origin HEAD:agent/consolidate-transcript-sources
