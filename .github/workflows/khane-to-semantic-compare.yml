name: Khane To semantic compare
on:
  push:
    branches: [agent/khane-to-final-reconcile]
    paths:
      - '.github/workflows/khane-to-semantic-compare.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/khane-to-final-reconcile
      - name: Install sklearn
        run: python -m pip install -q scikit-learn
      - name: Compare
        run: python .github/khane_to_semantic_compare.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/khane_to_semantic_reconciliation.md
          git commit -m 'add semantic khane-to reconciliation report' || true
          git push origin HEAD:agent/khane-to-final-reconcile
