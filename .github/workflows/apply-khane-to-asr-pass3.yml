name: Apply Khane To ASR cleanup pass3
on:
  push:
    branches: [agent/khane-to-asr-cleanup]
    paths:
      - .github/workflows/apply-khane-to-asr-pass3.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/khane-to-asr-cleanup
          fetch-depth: 0
      - run: python .github/apply_khane_to_asr_cleanup_pass3.py
      - name: Structural check against pre-clean baseline
        run: |
          python - <<'PY'
          import subprocess, pathlib
          ok=True
          for i in range(1,14):
              p=f'outputs/khane_to/review/md/{i}.md'
              old=subprocess.check_output(['git','show',f'197d286f7d793266c9e1bb8a4ca3549be76ce2ec:{p}']).decode()
              new=pathlib.Path(p).read_text()
              a,b=len(old.splitlines()),len(new.splitlines())
              print(i,a,b)
              ok &= a==b
          raise SystemExit(0 if ok else 1)
          PY
      - name: Scope check
        run: |
          bad=$(git status --porcelain | grep -vE '^.. (outputs/khane_to/review/md/|reports/khane_to_asr_cleanup_applied.md)' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/khane_to/review/md reports/khane_to_asr_cleanup_applied.md
          git commit -m "complete manual khane-to ASR cleanup"
          git push origin HEAD:agent/khane-to-asr-cleanup
