name: Audit Asre content retention
on:
  push:
    branches: [agent/asre-shirin-reconcile-final-md]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          def words(s):
              return len(re.findall(r'[\w\u0600-\u06ff]+',s))
          def main_text(path):
              r=subprocess.run(['git','show','origin/main:'+path],capture_output=True,text=True)
              return r.stdout if r.returncode==0 else ''
          rows=[]
          for n in range(1,27):
              op=f'outputs/asre_shirin/review/md/{n}.md'
              cur=Path(op).read_text(encoding='utf-8') if Path(op).exists() else ''
              prev=main_text(op)
              if n<=13:
                  old=Path(f'متن ها/۱/asre_shirin/asre-shirin-season-1/episode-{n:02d}.md')
              else:
                  old=Path(f'متن ها/۱/asre_shirin/asre-shirin-season-2/episode-{n-13:02d}.md')
              oldt=old.read_text(encoding='utf-8') if old.exists() else ''
              a,b,c=words(prev),words(oldt),words(cur)
              ratio=(c/a if a else None)
              rows.append((n,a,b,c,ratio))
          out=Path('reports/asre_shirin_reconciliation/content_retention.md')
          lines=['# Asre Shirin content-retention audit','', '| Ep | original Output words | two-season words | reconciled words | reconciled/original |','|---:|---:|---:|---:|---:|']
          for n,a,b,c,r in rows:
              lines.append(f'| {n} | {a} | {b} | {c} | {r:.2f} |' if r is not None else f'| {n} | {a} | {b} | {c} | — |')
          lines += ['', '## Flags (< 0.80 of original Output)', '']
          flags=[n for n,a,b,c,r in rows if r is not None and r<.80]
          lines.append('`'+str(flags)+'`')
          lines += ['', '> Word count is only a retention warning, not a quality score. A flagged episode must be reviewed for accidental summarization/content loss.']
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-asre-content-retention.yml
          git add reports/asre_shirin_reconciliation/content_retention.md
          git commit -m "audit: check Asre content retention"
          git push origin HEAD:agent/asre-shirin-reconcile-final-md