name: Lock remaining finals conservatively

on:
  push:
    paths:
      - '.github/workflows/lock-final-transcripts-conservative.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset finals to mother transcripts and apply curated repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          NUM=re.compile(r'(\d+)')
          def n_of(p):
              x=NUM.findall(p.stem); return int(x[-1]) if x else None
          def mother_files(root):
              files=list(Path(root).rglob('*.md'))
              pref=[p for p in files if '/review/md/' in ('/'+str(p).replace('\\','/'))]
              files=pref or files
              out={}
              for p in files:
                  n=n_of(p)
                  if n is not None: out[n]=p
              return dict(sorted(out.items()))

          cfgs=[
            ('خانه تو','outputs/khane_to','متن ها/khane-to','final/khane-to','reports/collections/khane_to.md'),
            ('MQ','outputs/mq','متن ها/mq','final/mq','reports/collections/mq.md'),
            ('تربیت مربی','outputs/tarbiat_morabi','متن ها/tarbiat_morabi','final/tarbiat-morabi','reports/collections/tarbiat_morabi.md'),
            ('دانشگاه تهران','outputs/uni_tehran','متن ها/uni_tehran','final/uni-tehran','reports/collections/uni_tehran.md'),
          ]

          # Only truly unambiguous ASR/orthographic repairs, reviewed from the first audit.
          curated={
            'خانه تو': {
              'تمبین':'تمرین','بدهگار':'بدهکار','پشوانه':'پشتوانه','پشتبانه':'پشتوانه',
              'پیشناد':'پیشنهاد','امتخاب':'انتخاب','تواناهی':'توانایی','منادار':'معنادار',
              'معموریت':'مأموریت','وردشکار':'ورزشکار','درامزایی':'درآمدزایی','توروم':'تورم',
              'مقرارات':'مقررات','بزرسالی':'بزرگسالی','تأمیم':'تصمیم','واراد':'وارد',
              'خدامات':'خدمات','کارگوزاری':'کارگزاری','ضراری':'ضروری','برانکی':'بانکی',
              'ایاکه':'اینکه','روانندگی':'رانندگی','راندگی':'رانندگی','تعلیف':'تعریف','شایردی':'شاگردی',
              'کشفرها':'کشورها'
            },
            'MQ': {'تشریف':'تعریف'},
            'تربیت مربی': {},
            'دانشگاه تهران': {},
          }

          def replace_exact_word(text,bad,good):
              # Persian-word boundaries; punctuation preserved.
              pat=re.compile(r'(?<![\u0600-\u06FF\u200c])'+re.escape(bad)+r'(?![\u0600-\u06FF\u200c])')
              return pat.subn(good,text)

          for label,outroot,refroot,finalroot,reportpath in cfgs:
              moms=mother_files(outroot)
              refs={}
              for p in Path(refroot).rglob('*.md'):
                  n=n_of(p)
                  if n is not None: refs[n]=p
              fd=Path(finalroot)
              if fd.exists(): shutil.rmtree(fd)
              fd.mkdir(parents=True,exist_ok=True)
              applied=[]
              for n,p in moms.items():
                  text=p.read_text(encoding='utf-8')
                  for bad,good in curated[label].items():
                      text,c=replace_exact_word(text,bad,good)
                      if c: applied.append((n,bad,good,c))
                  (fd/f'episode-{n:02d}.md').write_text(text,encoding='utf-8')

              # Rebuild report preserving structural comparison but correcting repair policy.
              old=Path(reportpath).read_text(encoding='utf-8') if Path(reportpath).exists() else ''
              # retain comparison table from prior report if present
              table=''
              m=re.search(r'## مقایسه قسمت‌ها\n\n(.*?)(?=\n## )',old,re.S)
              if m: table=m.group(1).strip()
              lines=[f'# گزارش نهایی‌سازی مجموعه «{label}»','',
                     '## سیاست نهایی','',
                     f'- متن مادر: `{outroot}` (نسخه `review/md`).',
                     f'- مرجع دوم: `{refroot}`.',
                     f'- Final: `{finalroot}`.',
                     '- Output مرجع مادر و حامل گفتار، جزئیات، مثال‌ها و ساختار مکالمه است.',
                     '- مرجع دوم فقط برای مقایسه و repair قابل‌اثبات استفاده شد؛ هرجا مرجع دوم ضعیف‌تر/رسمی‌تر/خراب‌تر بود، نادیده گرفته شد.',
                     '- هیچ تبدیل محاوره‌ای به رسمی یا رسمی به محاوره‌ای، خلاصه‌سازی، حذف مثال یا بازنویسی معنایی انجام نشده.',
                     '- عبارت‌های مبهم و `[نامفهوم]` بدون شاهد قطعی حدس زده نشدند.','',
                     '## هم‌ترازی','',
                     f'- مادر: {len(moms)} فایل؛ مرجع دوم: {len(refs)} فایل؛ جفت شماره‌ای: {len(set(moms)&set(refs))}.',
                     '- نگاشت شماره‌ای کامل است و دو منبع متعلق به همان جلسات‌اند.','']
              if table:
                  lines += ['## مقایسه قسمت‌ها','',table,'']
              lines += ['## repairهای واقعاً اعمال‌شده','']
              if applied:
                  lines += ['| قسمت | قبل | بعد | تعداد |','|---:|---|---|---:|']
                  for n,b,g,c in applied: lines.append(f'| {n} | `{b}` | `{g}` | {c} |')
              else:
                  lines.append('هیچ repair خودکار/حدسی اعمال نشد؛ Output پس از مقایسه عیناً حفظ شد.')
              lines += ['', '## کنترل منبع','', '- `outputs/` و `متن ها/` read-only و دست‌نخورده‌اند.', '- در تعارض مادی، صوت/ویدئوی اصلی مرجع نهایی است.','']
              Path(reportpath).write_text('\n'.join(lines),encoding='utf-8')

          # Update master report with safe-repair counts.
          def count_eps(path): return len(list(Path(path).glob('episode-*.md')))
          master=['# گزارش وضعیت مجموعه‌های ویدیویی','',
                  '| مجموعه | Final | وضعیت |','|---|---:|---|',
                  f'| خانه تو | {count_eps("final/khane-to")} | FINALIZED — Output-first |',
                  f'| MQ | {count_eps("final/mq")} | FINALIZED — Output-first |',
                  f'| تربیت مربی | {count_eps("final/tarbiat-morabi")} | FINALIZED — Output-first |',
                  f'| دانشگاه تهران | {count_eps("final/uni-tehran")} | FINALIZED — Output-first |','',
                  '- عصر شیرین: ۲۶/۲۶ تکمیل.',
                  '- در جستجوی خوشبختی: Final-C حفظ شده و extraction منبع سوم داخل `final/dar-jostojo-final-C/extracted/` قرار دارد.',
                  '- هیچ منبعی در `outputs/` یا `متن ها/` ویرایش نشده است.','']
          Path('reports/collections/README.md').write_text('\n'.join(master),encoding='utf-8')
          PY
      - name: Validate exact source isolation and commit
        shell: bash
        run: |
          set -e
          BAD=$(git status --porcelain | grep -E ' (outputs/|متن ها/)' || true)
          if [ -n "$BAD" ]; then echo "$BAD"; exit 1; fi
          test $(find final/khane-to -name 'episode-*.md' | wc -l) -eq 13
          test $(find final/mq -name 'episode-*.md' | wc -l) -eq 8
          test $(find final/tarbiat-morabi -name 'episode-*.md' | wc -l) -eq 14
          test $(find final/uni-tehran -name 'episode-*.md' | wc -l) -eq 38
          test -d final/dar-jostojo-final-C/extracted
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final reports .github/workflows/lock-final-transcripts-conservative.yml
          git rm .github/workflows/lock-final-transcripts-conservative.yml
          git commit -m 'lock remaining finals to output-first policy'
          git push
